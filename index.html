rchhoff Circuits & Trigonometry`,description:`Bridge into quantitative high-school science: run volumetric acid-base titrations and limiting-reactant stoichiometry, launch 2D ballistic projectiles, analyze Kirchhoff voltage dividers, and solve trigonometric geodesic systems.`,accentColor:`#D97706`,borderAccent:`border-amber-600`,bgTint:`bg-amber-50/70`,badgeText:`Stage 04 · Stoichiometry, Vectors & Trigonometry`,hasPeriodicTable:!1,highlights:{chemistry:`Quantitative titration curves, limiting reactant yield, enthalpy of neutralization, and redox precipitation.`,physics:`2D projectile vector kinematics, Kirchhoff potential divider circuits, and Snell’s Law total internal reflection.`,geometry:`Law of Sines & Cosines geodesic dome, double-elevation trigonometric cliff survey, and inscribed hexagon trig.`,english:`10 senior-level questions testing complex syntax, idiomatic precision, rhetorical logic, and critical reading.`}},{id:`S2`,title:`SENIOR 2`,shortTitle:`Senior 2`,ageRange:`Grade 11–12 · Advanced Multi-Step Systems`,subtitle:`Electrochemistry, Chemical Equilibrium, Faraday Induction & 3D Spatial Geometry`,description:`Tackle rigorous multi-step school-level synthesis: operate a Daniell galvanic cell and Le Chatelier equilibrium shifts, simulate Faraday electromagnetic induction and damped harmonic oscillators, and solve 3D spatial geometry.`,accentColor:`#E11D48`,borderAccent:`border-rose-600`,bgTint:`bg-rose-50/70`,badgeText:`Stage 05 · Multi-Step Systems & Synthesis`,hasPeriodicTable:!1,highlights:{chemistry:`Daniell galvanic cell (E°cell), Le Chatelier equilibrium shifts, permanganate redox titration, and catalytic kinetics.`,physics:`Faraday electromagnetic AC generator, damped harmonic oscillator phase space, and photoelectric stopping potential.`,geometry:`3D octahedron-in-cube cross-section, Apollonius mutually tangent curvature system, and 3D conical sector optimization.`,english:`10 advanced synthesis questions testing inversion, subjunctive mood, nuanced academic discourse, and deep inference.`}}],Te=[{id:`m1-anthocyanin-ph`,grade:`M1`,title:`Natural Anthocyanin pH Rainbow Indicator`,category:`Indicators & pH`,reactants:[{name:`Red Cabbage Extract (Anthocyanin)`,formula:`C₁₅H₁₁O₆⁺ (aq)`,state:`Liquid`,initialColor:`#7E22CE`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Citric Acid Solution (Lemon Juice)`,formula:`C₆H₈O₇ (aq)`,state:`Liquid`,initialColor:`#FEF9C3`,defaultAmount:25,minAmount:5,maxAmount:60,unit:`mL`}],interactionType:`Dropwise Titration`,reactionSummary:`Adding acidic citric juice shifts the purple anthocyanin pigment molecule into its protonated flavylium cation form, transforming the liquid from deep violet to vivid crimson-pink.`,products:[{name:`Protonated Flavylium Pigment`,formula:`C₁₅H₁₁O₆⁺ (acidic form)`,state:`Aqueous`},{name:`Citrate Ions`,formula:`C₆H₅O₇³⁻ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#7E22CE`,finalLiquidColor:`#E11D48`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:.4,initialPh:7,finalPh:2.8,observationText:`Immediate color transition from neutral royal purple (pH 7.0) to bright crimson-rose (pH 2.8) with no gas bubbles.`},equation:`Anthocyanin (purple, pH 7) + H⁺ (aq) → Flavylium Cation (crimson red, pH < 3)`,explanation:`Indicators are special pigment molecules that change shape and color depending on how acidic or basic a solution is. In Middle 1, we observe that acids turn red cabbage indicator bright pink/red, whereas bases turn it bluish-green.`,gradeFocusNote:`Middle 1 Focus: Identifying acids and bases using observable color shifts in natural indicators.`,challenge:{question:`If you added baking soda (a mild base) instead of citric acid to the purple cabbage indicator, what visual change would occur?`,options:[`The solution shifts toward blue-green as the pH rises above 7`,`A black solid metal settles at the bottom of the beaker`,`The liquid boils violently and freezes into ice`,`No color change happens because indicators only detect acids`],correctIndex:0,explanation:`Anthocyanin pigment turns pink/red in acidic solutions (pH < 7), stays purple in neutral water (pH 7), and turns blue-green or yellow-green in basic/alkaline solutions (pH > 7).`}},{id:`m1-bicarbonate-effervescence`,grade:`M1`,title:`Carbonate Effervescence & Gas Capture`,category:`Acid-Base`,reactants:[{name:`Acetic Acid (Dilute Ethanoic Acid)`,formula:`CH₃COOH (aq)`,state:`Liquid`,initialColor:`#F1F5F9`,defaultAmount:60,minAmount:20,maxAmount:100,unit:`mL`},{name:`Sodium Hydrogen Carbonate`,formula:`NaHCO₃ (s)`,state:`Solid Powder`,initialColor:`#FFFFFF`,defaultAmount:10,minAmount:2,maxAmount:25,unit:`g`}],interactionType:`Mix & Stir`,reactionSummary:`Solid sodium bicarbonate dissolves and reacts rapidly with acetic acid, producing vigorous carbon dioxide gas bubbles (effervescence) and a slight cooling effect.`,products:[{name:`Sodium Acetate`,formula:`CH₃COONa (aq)`,state:`Aqueous`},{name:`Water`,formula:`H₂O (l)`,state:`Liquid`},{name:`Carbon Dioxide Gas`,formula:`CO₂ (g)`,state:`Gas`}],visualResult:{initialLiquidColor:`#E2E8F0`,finalLiquidColor:`#F8FAFC`,hasBubbles:!0,bubbleGasLabel:`CO₂ (g)`,hasPrecipitate:!1,tempChangeCelsius:-3.2,initialPh:2.9,finalPh:6.4,observationText:`Rapid streams of colorless CO₂ gas bubbles rise through the liquid while the thermometer drops by 3.2 °C (endothermic).`},equation:`NaHCO₃ (s) + CH₃COOH (aq) → CH₃COONa (aq) + H₂O (l) + CO₂ (g)`,explanation:`Whenever a carbonate or hydrogen carbonate meets an acid, a chemical reaction creates a new dissolved salt, water, and carbon dioxide gas. The escaping gas forms visible fizzing bubbles, and the thermometer drops slightly because the reaction absorbs heat energy from the liquid.`,gradeFocusNote:`Middle 1 Focus: Recognizing gas evolution (effervescence) and temperature change as evidence of a chemical reaction.`,challenge:{question:`Which observation proves that a NEW substance was formed rather than the powder simply dissolving?`,options:[`Continuous generation of carbon dioxide gas bubbles and a pH shift toward neutral`,`The liquid remaining completely still at the bottom of the glass`,`The glass beaker reflecting light from the room`,`The white powder sinking before being stirred`],correctIndex:0,explanation:`Gas production (effervescence) accompanied by a temperature change and pH shift demonstrates that chemical bonds rearranged to form new products (CO₂, H₂O, and sodium acetate).`}},{id:`m1-endothermic-ammonium`,grade:`M1`,title:`Endothermic Cold-Pack Salt Dissolution`,category:`Solubility & Salts`,reactants:[{name:`Distilled Water`,formula:`H₂O (l)`,state:`Liquid`,initialColor:`#E0F2FE`,defaultAmount:80,minAmount:40,maxAmount:120,unit:`mL`},{name:`Ammonium Chloride Crystals`,formula:`NH₄Cl (s)`,state:`Crystalline Solid`,initialColor:`#FFFFFF`,defaultAmount:20,minAmount:5,maxAmount:40,unit:`g`}],interactionType:`Mix & Stir`,reactionSummary:`As white ammonium chloride crystals dissolve into water, breaking the ionic crystal lattice absorbs significant thermal energy from the water, causing the beaker temperature to plunge rapidly.`,products:[{name:`Hydrated Ammonium Ions`,formula:`NH₄⁺ (aq)`,state:`Aqueous`},{name:`Hydrated Chloride Ions`,formula:`Cl⁻ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#E0F2FE`,finalLiquidColor:`#BAE6FD`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:-11.5,initialPh:7,finalPh:5.5,observationText:`Crystals vanish into a clear solution as condensation frost forms on the outside of the beaker; temperature drops from 22.0 °C to 10.5 °C.`},equation:`NH₄Cl (s) + Heat Energy → NH₄⁺ (aq) + Cl⁻ (aq)`,explanation:`Some processes absorb heat from their surroundings instead of releasing it. We call these endothermic processes. Instant sports cold packs use this exact principle to cool an injury without needing a freezer.`,gradeFocusNote:`Middle 1 Focus: Distinguishing endothermic (heat-absorbing) vs. exothermic (heat-releasing) changes using a thermometer.`,challenge:{question:`Why does the outside of the glass beaker feel icy cold when ammonium chloride dissolves in water?`,options:[`Separating the crystal ions absorbs thermal energy from the water and glass`,`Cold air bubbles are pumped into the beaker from outside`,`The water turns into solid dry ice at room temperature`,`The thermometer is measuring the mass instead of temperature`],correctIndex:0,explanation:`In an endothermic dissolution, more heat energy is required to pull the solid ions apart than is released when water molecules surround them, drawing heat out of the water.`}},{id:`m1-limewater-breath`,grade:`M1`,title:`Cloudy Limewater Carbon Dioxide Detector`,category:`Precipitation`,reactants:[{name:`Clear Limewater (Calcium Hydroxide)`,formula:`Ca(OH)₂ (aq)`,state:`Liquid`,initialColor:`#F0F9FF`,defaultAmount:70,minAmount:30,maxAmount:100,unit:`mL`},{name:`Bubbled Carbon Dioxide Gas`,formula:`CO₂ (g)`,state:`Gas Stream`,initialColor:`#CBD5E1`,defaultAmount:15,minAmount:5,maxAmount:30,unit:`sec`}],interactionType:`Mix & Stir`,reactionSummary:`Bubbling carbon dioxide gas through crystal-clear limewater produces tiny suspended white particles of insoluble calcium carbonate (chalk), turning the liquid milky white.`,products:[{name:`Calcium Carbonate Precipitate (Chalk)`,formula:`CaCO₃ (s)`,state:`Solid Precipitate`},{name:`Water`,formula:`H₂O (l)`,state:`Liquid`}],visualResult:{initialLiquidColor:`#F0F9FF`,finalLiquidColor:`#F1F5F9`,hasBubbles:!0,bubbleGasLabel:`CO₂ (g)`,hasPrecipitate:!0,precipitateColor:`#FFFFFF`,precipitateLabel:`CaCO₃ (s) Milky Chalk Suspension`,tempChangeCelsius:1.1,initialPh:12.1,finalPh:8.3,observationText:`Clear calcium hydroxide solution turns milky-white as fine solid CaCO₃ particles form and slowly settle.`},equation:`Ca(OH)₂ (aq) + CO₂ (g) → CaCO₃ (s)↓ + H₂O (l)`,explanation:`Limewater is the classic laboratory test for carbon dioxide gas. Because calcium carbonate (chalk/limestone) cannot dissolve in water, it appears immediately as a cloudy white solid called a precipitate.`,gradeFocusNote:`Middle 1 Focus: Observing how two transparent reactants (a clear liquid and an invisible gas) can form an opaque solid precipitate.`,challenge:{question:`What is the white milky substance that makes the clear limewater turn cloudy?`,options:[`Insoluble solid particles of calcium carbonate (CaCO₃) suspended in water`,`Frozen ice crystals caused by cooling`,`Dissolved oxygen bubbles trapped at the bottom`,`Liquid metallic calcium floating on top`],correctIndex:0,explanation:`Carbon dioxide reacts with dissolved calcium hydroxide to form insoluble calcium carbonate (CaCO₃), which precipitates as fine white chalk particles.`}},{id:`m2-hcl-naoh-neutralization`,grade:`M2`,title:`Strong Acid–Base Neutralization & Salt Formation`,category:`Neutralization`,reactants:[{name:`Hydrochloric Acid (with Universal Indicator)`,formula:`HCl (aq)`,state:`Aqueous Acid`,initialColor:`#EF4444`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Sodium Hydroxide Solution`,formula:`NaOH (aq)`,state:`Aqueous Base`,initialColor:`#E2E8F0`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`}],interactionType:`Dropwise Titration`,reactionSummary:`Mixing equal amounts of hydrochloric acid and sodium hydroxide neutralizes both corrosive solutions, releasing warmth and turning the universal indicator emerald green at pH 7.0.`,products:[{name:`Sodium Chloride (Dissolved Table Salt)`,formula:`NaCl (aq)`,state:`Aqueous`},{name:`Water`,formula:`H₂O (l)`,state:`Liquid`}],visualResult:{initialLiquidColor:`#EF4444`,finalLiquidColor:`#10B981`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:6.8,initialPh:1.2,finalPh:7,observationText:`Solution transitions from acidic crimson (pH 1.2) to neutral emerald green (pH 7.0) with a +6.8 °C exothermic temperature rise.`},equation:`HCl (aq) + NaOH (aq) → NaCl (aq) + H₂O (l) + Heat`,explanation:`In a neutralization reaction, hydrogen ions (H⁺) from the acid combine with hydroxide ions (OH⁻) from the base to form neutral water molecules (H₂O), leaving behind dissolved sodium chloride salt (NaCl).`,gradeFocusNote:`Middle 2 Focus: Understanding Acid + Base → Salt + Water and tracking exothermic heat release.`,challenge:{question:`If you evaporate all the water from the beaker after exact neutralization at pH 7.0, what remains behind?`,options:[`White crystalline sodium chloride (NaCl) salt`,`Pure liquid hydrochloric acid`,`Solid metallic sodium that explodes in air`,`Nothing, because all products are gases`],correctIndex:0,explanation:`Neutralization of HCl and NaOH yields water (H₂O) and dissolved sodium chloride (NaCl). Evaporating the water leaves pure white NaCl crystals.`}},{id:`m2-mg-hcl-hydrogen`,grade:`M2`,title:`Active Metal + Acid Single Displacement`,category:`Metal-Acid Reaction`,reactants:[{name:`Dilute Hydrochloric Acid`,formula:`2 HCl (aq)`,state:`Aqueous Acid`,initialColor:`#E2E8F0`,defaultAmount:60,minAmount:30,maxAmount:100,unit:`mL`},{name:`Magnesium Ribbon Strip`,formula:`Mg (s)`,state:`Metallic Solid`,initialColor:`#94A3B8`,defaultAmount:4,minAmount:1,maxAmount:10,unit:`g`}],interactionType:`Mix & Stir`,reactionSummary:`Silvery magnesium ribbon dissolves rapidly in hydrochloric acid with brisk effervescence of flammable hydrogen gas (H₂) and strong exothermic heating.`,products:[{name:`Magnesium Chloride Solution`,formula:`MgCl₂ (aq)`,state:`Aqueous`},{name:`Hydrogen Gas`,formula:`H₂ (g)`,state:`Gas`}],visualResult:{initialLiquidColor:`#E2E8F0`,finalLiquidColor:`#F8FAFC`,hasBubbles:!0,bubbleGasLabel:`H₂ (g)`,hasPrecipitate:!1,tempChangeCelsius:14.5,initialPh:1.5,finalPh:4.8,observationText:`Vigorous streams of H₂ gas bubbles rise from the dissolving magnesium strip; beaker warms by +14.5 °C.`},equation:`Mg (s) + 2 HCl (aq) → MgCl₂ (aq) + H₂ (g)↑`,explanation:`Magnesium sits high above hydrogen in the reactivity series. It displaces hydrogen ions from the acid to form soluble magnesium chloride salt and diatomic hydrogen gas (which produces a characteristic "squeaky pop" when tested with a lit splint).`,gradeFocusNote:`Middle 2 Focus: Predicting metal + acid reactions and distinguishing H₂ gas from CO₂ gas.`,challenge:{question:`How do chemists confirm that the gas bubbling off the magnesium ribbon is hydrogen (H₂) rather than carbon dioxide (CO₂)?`,options:[`Bringing a lit splint near the gas mouth produces a sharp "squeaky pop" combustion sound`,`The gas turns purple cabbage juice bright yellow`,`The gas smells strongly of rotten eggs`,`The gas sinks and freezes the water at the bottom`],correctIndex:0,explanation:`Hydrogen gas (H₂) combusts rapidly with oxygen in air when ignited by a splint, creating a miniature shockwave heard as a "squeaky pop" (2H₂ + O₂ → 2H₂O).`}},{id:`m2-copper-hydroxide-precipitate`,grade:`M2`,title:`Transition Metal Azure Hydroxide Precipitation`,category:`Precipitation`,reactants:[{name:`Copper(II) Sulfate Solution`,formula:`CuSO₄ (aq)`,state:`Aqueous Solution`,initialColor:`#38BDF8`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Sodium Hydroxide Solution`,formula:`2 NaOH (aq)`,state:`Aqueous Base`,initialColor:`#F1F5F9`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`}],interactionType:`Mix & Stir`,reactionSummary:`Combining sky-blue copper(II) sulfate with clear sodium hydroxide immediately forms a dense, gelatinous royal-blue precipitate of insoluble copper(II) hydroxide.`,products:[{name:`Copper(II) Hydroxide Precipitate`,formula:`Cu(OH)₂ (s)`,state:`Solid Precipitate`},{name:`Sodium Sulfate Solution`,formula:`Na₂SO₄ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#38BDF8`,finalLiquidColor:`#E0F2FE`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#0284C7`,precipitateLabel:`Cu(OH)₂ (s) Deep Azure Gel`,tempChangeCelsius:2.1,initialPh:4.5,finalPh:9.2,observationText:`A thick, vibrant royal-blue solid precipitate of Cu(OH)₂ forms immediately and settles at the base of the pale solution.`},equation:`CuSO₄ (aq) + 2 NaOH (aq) → Cu(OH)₂ (s)↓ + Na₂SO₄ (aq)`,explanation:`While most sodium salts are soluble in water, most transition metal hydroxides are insoluble. When Cu²⁺ ions meet OH⁻ ions, they lock together into an insoluble royal-blue solid precipitate.`,gradeFocusNote:`Middle 2 Focus: Using solubility patterns and ion exchange to explain why precipitates form.`,challenge:{question:`Why does the blue color move from the liquid into the solid layer at the bottom of the beaker?`,options:[`Dissolved Cu²⁺ ions bond with OH⁻ ions to form insoluble solid Cu(OH)₂, removing copper ions from solution`,`The sodium sulfate turns deep blue and sinks`,`Water molecules turn blue when stirred`,`Copper metal melts into a blue liquid at the bottom`],correctIndex:0,explanation:`The blue color in CuSO₄ comes from hydrated Cu²⁺ ions. As they precipitate out as solid Cu(OH)₂, the remaining dissolved Na₂SO₄ solution becomes nearly colorless.`}},{id:`m2-magnesium-oxidation-synthesis`,grade:`M2`,title:`Magnesium Thermal Oxidation Synthesis`,category:`Synthesis`,reactants:[{name:`Polished Magnesium Ribbon`,formula:`2 Mg (s)`,state:`Metallic Solid`,initialColor:`#CBD5E1`,defaultAmount:5,minAmount:1,maxAmount:12,unit:`g`},{name:`Atmospheric Oxygen Gas`,formula:`O₂ (g)`,state:`Gas`,initialColor:`#E0F2FE`,defaultAmount:20,minAmount:10,maxAmount:50,unit:`L`}],interactionType:`Thermal Heating`,reactionSummary:`Heating magnesium metal in oxygen triggers a brilliant dazzling white exothermic glow, synthesizing a crumbly white ionic powder of magnesium oxide (MgO).`,products:[{name:`Magnesium Oxide Powder`,formula:`2 MgO (s)`,state:`Solid Powder`}],visualResult:{initialLiquidColor:`#F8FAFC`,finalLiquidColor:`#F1F5F9`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#FFFFFF`,precipitateLabel:`MgO (s) White Oxide Ash`,tempChangeCelsius:85,initialPh:7,finalPh:10.2,hasFlameOrGlow:!0,glowColor:`#FEF08A`,observationText:`Dazzling white thermal brilliance followed by deposition of fine white MgO powder; dissolving the ash in water yields an alkaline pH of 10.2.`},equation:`2 Mg (s) + O₂ (g) → 2 MgO (s) + Light & Heat`,explanation:`In a synthesis (combination) reaction, two elements combine directly to form a single compound. Notably, the mass of the white MgO powder is GREATER than the original magnesium metal because oxygen atoms from the air are now chemically bonded inside the solid.`,gradeFocusNote:`Middle 2 Focus: Conservation of mass in synthesis reactions and basicity of metal oxides.`,challenge:{question:`If 2.4 g of magnesium burns completely by combining with 1.6 g of oxygen gas from the air, what is the mass of the white magnesium oxide (MgO) formed?`,options:[`4.0 g (because mass is conserved as oxygen atoms bond with magnesium)`,`0.8 g (because burning always destroys mass)`,`2.4 g (because gases have zero mass)`,`1.6 g (because the magnesium disappears)`],correctIndex:0,explanation:`By the Law of Conservation of Mass, total mass of reactants (2.4 g Mg + 1.6 g O₂ = 4.0 g) equals the total mass of the solid product (4.0 g MgO).`}},{id:`m3-zn-cuso4-displacement`,grade:`M3`,title:`Single Displacement: Zinc in Copper(II) Sulfate`,category:`Single Displacement`,reactants:[{name:`Copper(II) Sulfate Solution`,formula:`CuSO₄ (aq)`,state:`Aqueous Solution`,initialColor:`#0284C7`,defaultAmount:65,minAmount:25,maxAmount:100,unit:`mL`},{name:`Granulated Zinc Metal`,formula:`Zn (s)`,state:`Metallic Solid`,initialColor:`#64748B`,defaultAmount:8,minAmount:2,maxAmount:20,unit:`g`}],interactionType:`Mix & Stir`,reactionSummary:`More reactive zinc metal displaces copper ions from the blue solution; the blue liquid gradually fades to colorless ZnSO₄ while reddish-brown solid copper metal plates out on the bottom.`,products:[{name:`Zinc Sulfate Solution (Colorless)`,formula:`ZnSO₄ (aq)`,state:`Aqueous`},{name:`Metallic Copper Deposit`,formula:`Cu (s)`,state:`Solid Metal`}],visualResult:{initialLiquidColor:`#0284C7`,finalLiquidColor:`#F1F5F9`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#B45309`,precipitateLabel:`Cu (s) Reddish-Brown Copper Metal`,tempChangeCelsius:9.4,initialPh:4.6,finalPh:5.4,observationText:`Deep azure solution decolorizes completely as reddish-brown metallic copper crystals precipitate; temperature rises by +9.4 °C.`},equation:`Zn (s) + CuSO₄ (aq) → ZnSO₄ (aq) + Cu (s)↓`,explanation:`In the metal reactivity series, Zinc (Zn) is more electropositive than Copper (Cu). Each neutral Zn atom transfers 2 electrons to a Cu²⁺ ion: Zn → Zn²⁺ + 2e⁻ and Cu²⁺ + 2e⁻ → Cu(s).`,gradeFocusNote:`Middle 3 Focus: Writing balanced ionic displacement equations and tracking electron transfer between metals.`,challenge:{question:`What would happen if you placed a strip of solid Copper (Cu) into a colorless solution of Zinc Sulfate (ZnSO₄)?`,options:[`No reaction occurs because copper is less reactive than zinc and cannot displace Zn²⁺ ions`,`Zinc metal immediately precipitates and the solution turns bright blue`,`Hydrogen gas explodes out of the beaker`,`Both metals dissolve into a purple gas`],correctIndex:0,explanation:`A displacement reaction is one-way: a less reactive metal (Cu) cannot displace a more reactive metal (Zn) from its salt solution.`}},{id:`m3-lead-iodide-golden-rain`,grade:`M3`,title:`Double Displacement: Lead(II) Iodide "Golden Rain"`,category:`Double Displacement`,reactants:[{name:`Lead(II) Nitrate Solution (Clear)`,formula:`Pb(NO₃)₂ (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Potassium Iodide Solution (Clear)`,formula:`2 KI (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`}],interactionType:`Mix & Stir`,reactionSummary:`Mixing two completely colorless aqueous salt solutions produces an instantaneous, brilliant canary-gold precipitate of insoluble lead(II) iodide crystals.`,products:[{name:`Lead(II) Iodide Golden Crystals`,formula:`PbI₂ (s)`,state:`Solid Precipitate`},{name:`Potassium Nitrate Solution`,formula:`2 KNO₃ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#F8FAFC`,finalLiquidColor:`#FEF9C3`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#EAB308`,precipitateLabel:`PbI₂ (s) Shimmering Golden Crystals`,tempChangeCelsius:1.5,initialPh:6.5,finalPh:6.8,observationText:`Two water-clear liquids react instantaneously to form a brilliant golden-yellow cloud of crystalline PbI₂ precipitate.`},equation:`Pb(NO₃)₂ (aq) + 2 KI (aq) → PbI₂ (s)↓ + 2 KNO₃ (aq)`,explanation:`Notice the stoichiometric 1 : 2 molar ratio in the balanced equation! Because the lead(II) ion carries a +2 charge (Pb²⁺) and each iodide ion carries a −1 charge (I⁻), exactly two moles of KI are required per mole of Pb(NO₃)₂.`,gradeFocusNote:`Middle 3 Focus: Balancing double-displacement equations and identifying spectator ions (K⁺ and NO₃⁻).`,challenge:{question:`In the balanced equation Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq), which ions are the "spectator ions" that remain dissolved and unchanged?`,options:[`K⁺ (aq) and NO₃⁻ (aq)`,`Pb²⁺ (aq) and I⁻ (aq)`,`Pb²⁺ (aq) and K⁺ (aq)`,`H⁺ (aq) and OH⁻ (aq)`],correctIndex:0,explanation:`The net ionic equation is Pb²⁺(aq) + 2I⁻(aq) → PbI₂(s). Potassium ions (K⁺) and nitrate ions (NO₃⁻) remain dissociated in solution before and after the reaction.`}},{id:`m3-copper-carbonate-decomposition`,grade:`M3`,title:`Thermal Decomposition of Green Malachite (CuCO₃)`,category:`Decomposition`,reactants:[{name:`Green Copper(II) Carbonate Powder`,formula:`CuCO₃ (s)`,state:`Solid Powder`,initialColor:`#10B981`,defaultAmount:15,minAmount:5,maxAmount:30,unit:`g`},{name:`Thermal Bunsen Energy Input`,formula:`Δ Heat (300 °C)`,state:`Thermal Energy`,initialColor:`#F59E0B`,defaultAmount:300,minAmount:200,maxAmount:450,unit:`°C`}],interactionType:`Thermal Heating`,reactionSummary:`Strong heating breaks down emerald-green copper(II) carbonate powder into jet-black copper(II) oxide solid while evolving colorless carbon dioxide gas.`,products:[{name:`Black Copper(II) Oxide Solid`,formula:`CuO (s)`,state:`Solid Powder`},{name:`Carbon Dioxide Gas`,formula:`CO₂ (g)`,state:`Gas`}],visualResult:{initialLiquidColor:`#D1FAE5`,finalLiquidColor:`#E2E8F0`,hasBubbles:!0,bubbleGasLabel:`CO₂ (g)`,hasPrecipitate:!0,precipitateColor:`#1E293B`,precipitateLabel:`CuO (s) Jet-Black Oxide Powder`,tempChangeCelsius:120,initialPh:7,finalPh:7,hasFlameOrGlow:!0,glowColor:`#F97316`,observationText:`Emerald-green CuCO₃ powder darkens into jet-black CuO solid as CO₂ gas escapes from the heated vessel.`},equation:`CuCO₃ (s) + Heat (Δ) → CuO (s) + CO₂ (g)↑`,explanation:`In a thermal decomposition reaction, a single compound breaks down into two or more simpler substances when heated. Unlike magnesium synthesis where solid mass increases, here the solid mass DECREASES because carbon dioxide gas leaves the vessel.`,gradeFocusNote:`Middle 3 Focus: Comparing synthesis vs. thermal decomposition and calculating mass loss due to escaping gas.`,challenge:{question:`When 12.4 g of green CuCO₃ is heated until it completely turns into 8.0 g of black CuO, why did the solid lose 4.4 g of mass?`,options:[`4.4 g of carbon dioxide gas (CO₂) escaped into the atmosphere during decomposition`,`Heat destroyed 4.4 g of copper atoms`,`The black CuO powder is lighter because black absorbs light`,`Water evaporated from the glass walls`],correctIndex:0,explanation:`By conservation of mass, 12.4 g CuCO₃ → 8.0 g CuO + 4.4 g CO₂(g). The 4.4 g difference is the exact mass of the evolved carbon dioxide gas.`}},{id:`m3-halogen-displacement-cl-ki`,grade:`M3`,title:`Group 17 Halogen Displacement: Chlorine + Potassium Iodide`,category:`Single Displacement`,reactants:[{name:`Potassium Iodide Solution`,formula:`2 KI (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Aqueous Chlorine Water`,formula:`Cl₂ (aq)`,state:`Aqueous Halogen`,initialColor:`#ECFCCB`,defaultAmount:30,minAmount:10,maxAmount:60,unit:`mL`}],interactionType:`Mix & Stir`,reactionSummary:`More reactive chlorine molecules oxidize colorless iodide ions (I⁻) into dissolved molecular iodine (I₂), turning the clear liquid a rich amber-brown.`,products:[{name:`Potassium Chloride Solution`,formula:`2 KCl (aq)`,state:`Aqueous`},{name:`Aqueous Molecular Iodine`,formula:`I₂ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#F8FAFC`,finalLiquidColor:`#B45309`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:2.3,initialPh:6.8,finalPh:6.2,observationText:`Colorless potassium iodide solution immediately turns deep amber-mahogany as free molecular iodine (I₂) is liberated.`},equation:`Cl₂ (aq) + 2 KI (aq) → 2 KCl (aq) + I₂ (aq)`,explanation:`Unlike Group 1 metals where reactivity increases down the group, Group 17 halogens become MORE reactive near the top of the group (F₂ > Cl₂ > Br₂ > I₂) because smaller halogen atoms attract an incoming electron more strongly.`,gradeFocusNote:`Middle 3 Focus: Periodic Group 17 reactivity trends and nonmetal displacement equations.`,challenge:{question:`Why is Chlorine (Period 3) able to displace Iodine (Period 5) from potassium iodide?`,options:[`Chlorine has fewer electron shells and a smaller atomic radius, attracting electrons more strongly than iodine`,`Chlorine has a heavier atomic mass than iodine`,`Iodine is a noble gas with a full outer shell`,`Potassium prefers to bond with larger atoms only`],correctIndex:0,explanation:`In Group 17 (halogens), oxidizing power increases UP the group because valence electrons are closer to the positively charged nucleus with less inner-shell shielding.`}},{id:`s1-quantitative-titration-h2so4`,grade:`S1`,title:`Diprotic Acid Volumetric Titration (H₂SO₄ + 2 NaOH)`,category:`Neutralization`,reactants:[{name:`0.50 M Sulfuric Acid (Phenolphthalein Indicator)`,formula:`H₂SO₄ (aq)`,state:`Standard Acid`,initialColor:`#F8FAFC`,defaultAmount:25,minAmount:10,maxAmount:50,unit:`mL`},{name:`1.00 M Sodium Hydroxide Titrant`,formula:`2 NaOH (aq)`,state:`Standard Base`,initialColor:`#F8FAFC`,defaultAmount:25,minAmount:10,maxAmount:50,unit:`mL`}],interactionType:`Dropwise Titration`,reactionSummary:`Because sulfuric acid is diprotic (donates 2 H⁺ ions per molecule), neutralization requires a 2:1 molar ratio of NaOH to H₂SO₄, reaching the phenolphthalein magenta endpoint at pH 8.4.`,products:[{name:`Sodium Sulfate`,formula:`Na₂SO₄ (aq)`,state:`Aqueous`},{name:`Water (2 Moles)`,formula:`2 H₂O (l)`,state:`Liquid`}],visualResult:{initialLiquidColor:`#F8FAFC`,finalLiquidColor:`#EC4899`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:7.9,initialPh:.9,finalPh:8.4,observationText:`Clear acidic analyte reaches stoichiometric equivalence and flashes rose-magenta as phenolphthalein crosses pH 8.2.`},equation:`H₂SO₄ (aq) + 2 NaOH (aq) → Na₂SO₄ (aq) + 2 H₂O (l)   (ΔH = −114 kJ/mol)`,explanation:`Using the titration formula n_a · M_a · V_a = n_b · M_b · V_b: since H₂SO₄ furnishes 2 moles of H⁺ per mole of acid (n_a = 2), 25.0 mL of 0.50 M H₂SO₄ contains 0.0125 mol H₂SO₄ (0.0250 mol H⁺), requiring exactly 0.0250 mol NaOH (25.0 mL of 1.00 M NaOH).`,gradeFocusNote:`Senior 1 Focus: Molarity calculations (M = n/V) and diprotic stoichiometry in volumetric analysis.`,challenge:{question:`What volume of 0.50 M NaOH would be required to completely neutralize 25.0 mL of 0.50 M diprotic H₂SO₄?`,options:[`50.0 mL of 0.50 M NaOH (because 2 moles of NaOH are needed per 1 mole of H₂SO₄)`,`25.0 mL of 0.50 M NaOH`,`12.5 mL of 0.50 M NaOH`,`100.0 mL of 0.50 M NaOH`],correctIndex:0,explanation:`Moles of H₂SO₄ = 0.50 M × 0.025 L = 0.0125 mol. Moles of NaOH needed = 2 × 0.0125 = 0.0250 mol. Volume of 0.50 M NaOH = 0.0250 mol / 0.50 M = 0.050 L = 50.0 mL.`}},{id:`s1-silver-chloride-gravimetric`,grade:`S1`,title:`Gravimetric Halide Analysis: Silver Nitrate + Chloride`,category:`Precipitation`,reactants:[{name:`0.20 M Silver Nitrate Solution`,formula:`AgNO₃ (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`0.20 M Sodium Chloride Solution`,formula:`NaCl (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`}],interactionType:`Mix & Stir`,reactionSummary:`Silver ions quantitatively precipitate chloride ions out of solution as curdy white silver chloride (AgCl), allowing precise gravimetric mass determination.`,products:[{name:`Silver Chloride Precipitate`,formula:`AgCl (s)`,state:`Solid Precipitate`},{name:`Sodium Nitrate Solution`,formula:`NaNO₃ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#F8FAFC`,finalLiquidColor:`#F1F5F9`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#E2E8F0`,precipitateLabel:`AgCl (s) Curdy White Precipitate (1.43 g)`,tempChangeCelsius:1.8,initialPh:6.9,finalPh:6.9,observationText:`Dense curdy white AgCl precipitate settles rapidly; filtering and drying yields 1.433 g per 0.010 mol reacted.`},equation:`Ag⁺ (aq) + Cl⁻ (aq) → AgCl (s)↓   (Molar Mass AgCl = 143.32 g/mol)`,explanation:`In gravimetric analysis, chemists determine the unknown amount of chloride in a water sample by precipitating all Cl⁻ ions with excess Ag⁺, filtering, drying, and weighing the pure AgCl(s).`,gradeFocusNote:`Senior 1 Focus: Converting between molarity, moles, and precipitate mass in grams (m = n × MM).`,challenge:{question:`If 50.0 mL of 0.20 M AgNO₃ (0.010 mol) reacts with excess NaCl, what theoretical mass of solid AgCl (Molar Mass = 143.3 g/mol) precipitates?`,options:[`1.433 g of AgCl`,`0.143 g of AgCl`,`14.33 g of AgCl`,`2.866 g of AgCl`],correctIndex:0,explanation:`n(AgNO₃) = 0.20 mol/L × 0.050 L = 0.010 mol. Since the mole ratio is 1:1, 0.010 mol of AgCl forms: mass = 0.010 mol × 143.3 g/mol = 1.433 g.`}},{id:`s1-limiting-reactant-barium-sulfate`,grade:`S1`,title:`Limiting Reactant Stoichiometry: Barium Sulfate Yield`,category:`Double Displacement`,reactants:[{name:`0.10 M Barium Chloride Solution`,formula:`BaCl₂ (aq)`,state:`Aqueous Solution`,initialColor:`#F8FAFC`,defaultAmount:40,minAmount:10,maxAmount:100,un ory:`Combustion & Oxidation`,reactants:[{name:`Iron(III) Oxide (Hematite Powder)`,formula:`Fe₂O₃ (s)`,state:`Solid Powder`,initialColor:`#991B1B`,defaultAmount:16,minAmount:8,maxAmount:32,unit:`g`},{name:`Fine Aluminum Powder`,formula:`2 Al (s)`,state:`Metallic Powder`,initialColor:`#94A3B8`,defaultAmount:5.4,minAmount:2.7,maxAmount:10.8,unit:`g`}],interactionType:`Thermal Heating`,reactionSummary:`Aluminum has such a strong affinity for oxygen that it reduces iron(III) oxide in an intensely exothermic redox reaction, producing glowing molten metallic iron.`,products:[{name:`Aluminum Oxide Slag`,formula:`Al₂O₃ (s)`,state:`Solid`},{name:`Molten Metallic Iron`,formula:`2 Fe (l)`,state:`Liquid Metal`}],visualResult:{initialLiquidColor:`#FEE2E2`,finalLiquidColor:`#FEF3C7`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#475569`,precipitateLabel:`Fe (s) Reduced Metallic Iron Core`,tempChangeCelsius:240,initialPh:7,finalPh:7,hasFlameOrGlow:!0,glowColor:`#F59E0B`,observationText:`Brilliant amber-white incandescence as Al oxidizes to Al₂O₃ and reduces Fe³⁺ into a dense metallic iron bead.`},equation:`Fe₂O₃ (s) + 2 Al (s) → Al₂O₃ (s) + 2 Fe (l)   (ΔH° = −852 kJ/mol)`,explanation:`Oxidation states show who gains and loses electrons: Aluminum is oxidized from 0 in Al(s) to +3 in Al₂O₃ (reducing agent), while Iron is reduced from +3 in Fe₂O₃ to 0 in elemental Fe (oxidizing agent).`,gradeFocusNote:`Senior 1 Focus: Assigning oxidation numbers, identifying oxidizing/reducing agents, and enthalpy changes.`,challenge:{question:`In the reaction Fe₂O₃ + 2Al → Al₂O₃ + 2Fe, how does the oxidation number of Iron (Fe) change, and what role does Fe₂O₃ play?`,options:[`Fe changes from +3 to 0 (it is reduced, so Fe₂O₃ acts as the oxidizing agent)`,`Fe changes from 0 to +3 (it is oxidized, so Fe₂O₃ acts as the reducing agent)`,`Fe stays at +2 throughout the entire reaction`,`Al changes from +3 to 0 while oxygen is reduced`],correctIndex:0,explanation:`In Fe₂O₃, oxygen is −2, so 2Fe + 3(−2) = 0 ⇒ Fe = +3. In elemental Fe(l), the oxidation state is 0. Gaining electrons (+3 → 0) is reduction, making Fe₂O₃ the oxidizing agent.`}},{id:`s2-daniell-galvanic-cell`,grade:`S2`,title:`Daniell Galvanic Electrochemical Cell (Zn | Zn²⁺ || Cu²⁺ | Cu)`,category:`Electrochemistry & Redox`,reactants:[{name:`1.0 M Zinc Sulfate Anode Half-Cell`,formula:`Zn (s) | ZnSO₄ (aq)`,state:`Anode Half-Cell`,initialColor:`#E2E8F0`,defaultAmount:100,minAmount:50,maxAmount:150,unit:`mL`},{name:`1.0 M Copper(II) Sulfate Cathode Half-Cell`,formula:`CuSO₄ (aq) | Cu (s)`,state:`Cathode Half-Cell`,initialColor:`#0284C7`,defaultAmount:100,minAmount:50,maxAmount:150,unit:`mL`}],interactionType:`Electrode Immersion`,reactionSummary:`Connecting a Zinc anode and Copper cathode through an external voltmeter and KNO₃ salt bridge generates a spontaneous electromotive force of E°cell = +1.10 V.`,products:[{name:`Oxidized Zinc Cations at Anode`,formula:`Zn²⁺ (aq) + 2e⁻`,state:`Aqueous`},{name:`Plated Copper Metal at Cathode`,formula:`Cu (s) (+1.10 V EMF)`,state:`Solid Electrode`}],visualResult:{initialLiquidColor:`#0284C7`,finalLiquidColor:`#38BDF8`,hasBubbles:!1,hasPrecipitate:!0,precipitateColor:`#B45309`,precipitateLabel:`Cu(s) Cathode Growth | E°cell = +1.10 V`,tempChangeCelsius:.8,initialPh:5,finalPh:5.2,hasElectrodeSetup:!0,observationText:`Electrons flow from the Zn anode (−0.76 V) to the Cu cathode (+0.34 V); digital voltmeter reads +1.10 V while copper plates onto the cathode.`},equation:`Zn (s) + Cu²⁺ (aq) → Zn²⁺ (aq) + Cu (s)   (E°cell = E°cathode − E°anode = +0.34 V − (−0.76 V) = +1.10 V)`,explanation:`In a galvanic (voltaic) cell, oxidation occurs at the Anode (Zn → Zn²⁺ + 2e⁻) and reduction occurs at the Cathode (Cu²⁺ + 2e⁻ → Cu). The salt bridge migrates anions (NO₃⁻) into the anode compartment and cations (K⁺) into the cathode compartment to maintain electrical neutrality.`,gradeFocusNote:`Senior 2 Focus: Calculating standard cell potentials (E°cell), anode/cathode half-reactions, and salt-bridge ion migration.`,challenge:{question:`Given standard reduction potentials E°(Zn²⁺/Zn) = −0.76 V and E°(Ag⁺/Ag) = +0.80 V, what would be the standard cell voltage E°cell of a Zn | Zn²⁺ || Ag⁺ | Ag galvanic cell?`,options:[`+1.56 V (calculated as E°cathode − E°anode = +0.80 V − (−0.76 V))`,`+0.04 V (calculated by adding −0.76 V + 0.80 V)`,`−1.56 V (a non-spontaneous cell)`,`+2.36 V (because silver requires two electrons)`],correctIndex:0,explanation:`Standard cell potential E°cell = E°cathode(reduction) − E°anode(oxidation) = +0.80 V − (−0.76 V) = +1.56 V. Remember that standard electrode potentials are intensive properties and are not multiplied by stoichiometric coefficients.`}},{id:`s2-le-chatelier-iron-thiocyanate`,grade:`S2`,title:`Le Chatelier Chemical Equilibrium Shift: [Fe(SCN)]²⁺ Complex`,category:`Solubility & Salts`,reactants:[{name:`Pale Amber Iron(III) Nitrate Solution`,formula:`Fe(NO₃)₃ (aq)`,state:`Aqueous Equilibrium`,initialColor:`#FDE68A`,defaultAmount:50,minAmount:10,maxAmount:100,unit:`mL`},{name:`Potassium Thiocyanate Perturbation`,formula:`KSCN (aq)`,state:`Aqueous Ligand`,initialColor:`#F8FAFC`,defaultAmount:30,minAmount:5,maxAmount:80,unit:`mL`}],interactionType:`Dropwise Titration`,reactionSummary:`Adding SCN⁻ ions stresses the reversible equilibrium Fe³⁺ + SCN⁻ ⇌ [Fe(SCN)]²⁺, shifting the position of equilibrium strongly to the right and turning the pale yellow liquid deep blood-crimson.`,products:[{name:`Iron(III) Thiocyanate Complex Ion`,formula:`[Fe(SCN)]²⁺ (aq)`,state:`Aqueous Complex`},{name:`Spectator Potassium & Nitrate Ions`,formula:`K⁺ (aq) + NO₃⁻ (aq)`,state:`Aqueous`}],visualResult:{initialLiquidColor:`#FDE68A`,finalLiquidColor:`#991B1B`,hasBubbles:!1,hasPrecipitate:!1,tempChangeCelsius:-1.4,initialPh:3.2,finalPh:3.4,observationText:`Equilibrium shifts right (Q < K_c) upon reactant addition, intensifying from pale straw-yellow to deep ruby-crimson.`},equation:`Fe³⁺ (aq, pale yellow) + SCN⁻ (aq, colorless) ⇌ [Fe(SCN)]²⁺ (aq, deep crimson)   (ΔH < 0)`,explanation:`According to Le Chatelier’s Principle, increasing the concentration of a reactant (Fe³⁺ or SCN⁻) causes the reversible system to shift toward products to partially offset the added stress, deepening the crimson color of [Fe(SCN)]²⁺.`,gradeFocusNote:`Senior 2 Focus: Predicting reversible equilibrium shifts (concentration and temperature stresses) via Le Chatelier’s Principle.`,challenge:{question:`Because the forward reaction Fe³⁺ + SCN⁻ ⇌ [Fe(SCN)]²⁺ is exothermic (ΔH < 0), what happens to the deep crimson color if the equilibrium mixture is heated in a hot water bath?`,options:[`The solution fades toward pale yellow as equilibrium shifts left (endothermic direction) to absorb the added heat`,`The crimson color turns jet black because K_c increases with heat`,`Solid iron metal precipitates at the bottom`,`Temperature never affects the equilibrium constant K_c`],correctIndex:0,explanation:`For an exothermic forward reaction (Heat is a product), raising temperature shifts the equilibrium left toward the reactants (Fe³⁺ + SCN⁻), decreasing [Fe(SCN)]²⁺ and lightening the color.`}},{id:`s2-permanganate-redox-titration`,grade:`S2`,title:`Permanganate Self-Indicating Redox Titration (MnO₄⁻ + 5 Fe²⁺)`,category:`Electrochemistry & Redox`,reactants:[{name:`Acidified Iron(II) Sulfate Solution`,formula:`5 Fe²⁺ (aq) + 8 H⁺ (aq)`,state:`Aqueous Reducing Agent`,initialColor:`#DCFCE7`,defaultAmount:50,minAmount:20,maxAmount:100,unit:`mL`},{name:`Potassium Permanganate Titrant`,formula:`KMnO₄ (aq)`,state:`Aqueous Oxidizing Agent`,initialColor:`#7E22CE`,defaultAmount:25,minAmount:10,maxAmount:60,unit:`mL`}],interactionType:`Dropwise Titration`,reactionSummary:`Deep violet permanganate ions (MnO₄⁻, Mn = +7) oxidize pale-green Fe²⁺ ions into Fe³⁺ while being reduced to nearly colorless Mn²⁺ ions; the first excess drop turns the flask persistent rose-pink.`,products:[{name:`Manganese(II) Ions`,formula:`Mn²⁺ (aq, pale/colorless)`,state:`Aqueo  by volume) compared to the surrounding liquid’s density.`,challenge:{question:`A mystery cube has a mass of 180 g and a volume of 200 cm³. What happens when it is placed in pure water (ρ = 1.00 g/cm³)?`,options:[`It floats with 90% of its volume submerged because ρ_cube = 0.90 g/cm³ < 1.00 g/cm³`,`It sinks rapidly to the bottom because 180 g is heavy`,`It hovers above the water in mid-air`,`It dissolves into hydrogen gas`],correctIndex:0,explanation:`Density ρ = 180 g ÷ 200 cm³ = 0.90 g/cm³. Because 0.90 g/cm³ is less than water’s 1.00 g/cm³, it floats with 90% submerged.`}},{id:`m1-gravity-drop`,title:`Planetary Gravity & Free-Fall Vacuum Tower`,subtitle:`Gravitational Acceleration`,formula:`h = ½ g t²   ⇒   t = √(2h / g)`,conceptSummary:`In a vacuum without air resistance, all objects fall with the same gravitational acceleration g, which depends on the mass and radius of the planet or moon.`,challenge:{question:`Why does a hammer dropped from 20 meters take much longer to hit the ground on the Moon (g = 1.6 m/s²) than on Earth (g = 9.8 m/s²)?`,options:[`The Moon has a smaller mass and weaker gravitational field strength g than Earth`,`The Moon has thick air that slows the hammer down`,`The hammer loses its mass (kg) when taken to the Moon`,`Gravity pushes upward on the Moon`],correctIndex:0,explanation:`An object’s mass (kg) never changes by location, but the Moon’s smaller planetary mass creates only about 1/6th of Earth’s gravitational pull (g = 1.6 m/s²).`}}],M2:[{id:`m2-newton-cart`,title:`Newton’s Second Law (F_net = m · a) Dynamics Rig`,subtitle:`Force, Mass, Friction & Acceleration`,formula:`a = (F_applied − f_friction) / m`,conceptSummary:`Acceleration is directly proportional to the net unbalanced force acting on an object and inversely proportional to its mass (kg).`,challenge:{question:`A 5 kg dynamics cart experiences a forward pull of 35 N and a backward friction force of 10 N. What is its acceleration?`,options:[`5.0 m/s²`,`7.0 m/s²`,`9.0 m/s²`,`25.0 m/s²`],correctIndex:0,explanation:`First find net force: F_net = 35 N − 10 N = 25 N. Then apply Newton’s Second Law: a = F_net / m = 25 N / 5 kg = 5.0 m/s².`}},{id:`m2-hydraulic-lift`,title:`Pascal’s Principle Hydraulic PressureMultiplier`,subtitle:`Fluid Pressure & Mechanical Advantage`,formula:`P = F₁ / A₁ = F₂ / A₂   ⇒   F₂ = F₁ × (A₂ / A₁)`,conceptSummary:`Pressure applied to an enclosed incompressible fluid is transmitted equally in all directions, allowing a small force on a narrow piston to lift a heavy load on a wide piston.`,challenge:{question:`If you push down with F₁ = 100 N on a small piston of area A₁ = 2 cm², what upward force F₂ is produced on a large piston of area A₂ = 50 cm²?`,options:[`2,500 N`,`250 N`,`5,000 N`,`4 N`],correctIndex:0,explanation:`Mechanical advantage = A₂ / A₁ = 50 cm² / 2 cm² = 25. Output force F₂ = 100 N × 25 = 2,500 N.`}},{id:`m2-ohm-circuit`,title:`Ohm’s Law & Electrical Power Bench`,subtitle:`Voltage, Current, Resistance & Power`,formula:`I = V / R   and   P = V × I = V² / R`,conceptSummary:`Electric current (Amperes) increases when battery voltage (Volts) increases and decreases when load resistance (Ohms) increases.`,challenge:{question:`A 12 V battery is connected across a 4 Ω lamp filament. What current flows through the lamp, and what electrical power is dissipated?`,options:[`I = 3.0 A and P = 36 W`,`I = 48 A and P = 192 W`,`I = 0.33 A and P = 4 W`,`I = 3.0 A and P = 12 W`],correctIndex:0,explanation:`By Ohm’s Law, I = V / R = 12 V / 4 Ω = 3.0 A. Electrical power P = V × I = 12 V × 3.0 A = 36 Watts.`}}],M3:[{id:`m3-wave-oscilloscope`,title:`Transverse Wave Oscilloscope (v = f · λ)`,subtitle:`Frequency, Wavelength, Amplitude & Wave Speed`,formula:`v = f × λ   and   T = 1 / f`,conceptSummary:`Wave speed equals frequency (Hz) multiplied by wavelength (m), while amplitude determines the wave’s energy without changing its speed.`,challenge:{question:`A transverse wave on a stretched cord has a frequency of 25 Hz and a wavelength of 1.6 m. What is the speed of the wave?`,options:[`40.0 m/s`,`15.6 m/s`,`26.6 m/s`,`0.064 m/s`],correctIndex:0,explanation:`Using the wave equation v = f × λ = 25 Hz × 1.6 m = 40.0 m/s.`}},{id:`m3-lens-optics`,title:`Converging Thin-Lens Ray-Tracing Bench`,subtitle:`Geometric Optics & Real/Virtual Image Formation`,formula:`1 / f = 1 / d_o + 1 / d_i   and   M = −d_i / d_o`,conceptSummary:`A convex converging lens bends parallel rays through its focal point F. Placing an object beyond F forms a real, inverted image; placing it inside F forms a virtual, upright magnified image.`,challenge:{question:`An object is placed at d_o = 30 cm in front of a convex lens of focal length f = 10 cm. At what distance d_i does the real image form?`,options:[`15.0 cm behind the lens`,`20.0 cm behind the lens`,`30.0 cm behind the lens`,`7.5 cm behind the lens`],correctIndex:0,explanation:`1/d_i = 1/f − 1/d_o = 1/10 − 1/30 = (3 − 1)/30 = 2/30 = 1/15 ⇒ d_i = +15.0 cm.`}},{id:`m3-energy-coaster`,title:`Mechanical Energy Conservation Coaster`,subtitle:`Gravitational Potential vs. Kinetic Energy`,formula:`E_total = m g h + ½ m v² = constant`,conceptSummary:`On a frictionless track, gravitational potential energy (PE = mgh) converts continuously into kinetic energy (KE = ½mv²) as the car descends, keeping total mechanical energy constant.`,challenge:{question:`A coaster car starts from rest at the top of a 20 m hill (use g = 10 m/s²). What is its speed at the very bottom of the hill (h = 0 m) ignoring friction?`,options:[`20.0 m/s`,`10.0 m/s`,`40.0 m/s`,`200 m/s`],correctIndex:0,explanation:`By conservation of mechanical energy, mgh = ½mv² ⇒ v = √(2gh) = √(2 × 10 × 20) = √400 = 20.0 m/s.`}}],S1:[{id:`s1-projectile-2d`,title:`2D Ballistic Projectile Vector Kinematics`,subtitle:`Parabolic Trajectory, Apex Height & Horizontal Range`,formula:`R = (v₀² sin 2θ) / g   and   H_max = (v₀ sin θ)² / (2g)`,conceptSummary:`2D projectile motion consists of independent horizontal motion at constant velocity (v_x = v₀ cos θ) and vertical motion under constant gravitational acceleration (a_y = −g).`,challenge:{question:`In the absence of air resistance, which launch angle θ maximizes the horizontal range R of a projectile launched over level ground, and what is the vertical velocity v_y at the exact highest point (apex)?`,options:[`θ = 45° maximizes range, and v_y = 0 m/s at the apex (while v_x = v₀ cos θ remains non-zero)`,`θ = 60° maximizes range, and both v_x and v_y are zero at the apex`,`θ = 30° maximizes range, and v_y is maximum at the apex`,`θ = 90° maximizes horizontal range`],correctIndex:0,explanation:`Since R = (v₀² sin 2θ)/g and sin(2θ) reaches its maximum value of 1 at 2θ = 90°, θ = 45° gives maximum horizontal range. At the apex, vertical velocity v_y is momentarily zero while horizontal velocity v_x = v₀ cos θ remains constant.`}},{id:`s1-kirchhoff-divider`,title:`Kirchhoff Potential Divider & Internal Resistance Lab`,subtitle:`DC Network Analysis & Terminal Voltage Drop`,formula:`I = ε / (R₁ + R₂ + r)   and   V_out = ε × R₂ / (R₁ + R₂ + r)`,conceptSummary:`By Kirchhoff’s Voltage Law, the sum of potential drops across external series resistors and internal battery resistance r equals the source electromotive force ε.`,challenge:{question:`A battery with EMF ε = 12.0 V and internal resistance r = 1.0 Ω is connected in series with R₁ = 2.0 Ω and R₂ = 3.0 Ω. What is the circuit current I and the voltage drop V₂ across R₂?`,options:[`I = 2.0 A and V₂ = 6.0 V`,`I = 2.4 A and V₂ = 7.2 V`,`I = 1.0 A and V₂ = 3.0 V`,`I = 4.0 A and V₂ = 12.0 V`],correctIndex:0,explanation:`Total resistance R_tot = R₁ + R₂ + r = 2.0 + 3.0 + 1.0 = 6.0 Ω. Current I = 12.0 V / 6.0 Ω = 2.0 A. Voltage across R₂ is V₂ = I × R₂ = 2.0 A × 3.0 Ω = 6.0 V.`}},{id:`s1-snell-refraction`,title:`Snell’s Law & Total Internal Reflection Laser Bench`,subtitle:`Wave Refraction & Critical Angle Optics`,formula:`n₁ sin θ₁ = n₂ sin θ₂   and   sin θ_c = n₂ / n₁ (for n₁ > n₂)`,conceptSummary:`When light travels from a denser medium (higher n₁) toward a less dense medium (lower n₂), it bends away from the normal; exceeding the critical angle θ_c causes 100% Total Internal Reflection.`,challenge:{question:`A laser beam travels inside glass (n₁ = 1.50) toward air (n₂ = 1.00). What happens when the angle of incidence θ₁ exceeds the critical angle θ_c = arcsin(1.00 / 1.50) ≈ 41.8°?`,options:[`The beam undergoes Total Internal Reflection back into the glass at an angle equal to θ₁`,`The beam exits into the air along the normal at 0°`,`The laser light stops moving and disappears completely`,`The wavelength of the light becomes infinite`],correctIndex:0,explanation:`When θ₁ > θ_c (41.8° for glass-to-air), Snell’s Law would require sin θ₂ > 1, which is impossible; thus 100% of the light reflects internally back into the denser medium.`}}],S2:[{id:`s2-faraday-generator`,title:`Faraday Electromagnetic Induction AC Alternator`,subtitle:`Magnetic Flux Linkage & Sinusoidal EMF`,formula:`ε(t) = −dΦ_B/dt = N B A ω sin(ωt)`,conceptSummary:`Rotating a conducting coil of N turns and area A at angular velocity ω inside a uniform magnetic field B induces an alternating EMF whose peak voltage is proportional to N·B·A·ω.`,challenge:{question:`If you double the rotational angular speed ω of an AC generator coil while keeping N, B, and A constant, how do the peak induced EMF (ε_max) and the oscillation period (T) change?`,options:[`Peak induced EMF (ε_max) doubles and the period (T) is halved`,`Peak induced EMF stays the same while the period doubles`,`Both peak induced EMF and period are cut in half`,`Peak induced EMF quadruples and period stays constant`],correctIndex:0,explanation:`Since ε_max = N·B·A·ω, doubling ω directly doubles the peak voltage. Meanwhile, period T = 2π / ω is inversely proportional to ω, so doubling ω halves the period.`}},{id:`s2-damped-oscillator`,title:`Damped Simple Harmonic Oscillator Phase Analyzer`,subtitle:`Restoring Force, Natural Frequency & Vis .challenge.explanation]})]})]})]})},Me=[{id:`m1-geo-1`,grade:`M1`,title:`The Octagonal Star-Labyrinth Vertex`,subtitle:`Supplementary & Interior Polygon Angle Lock`,conceptTag:`Interior & Supplementary Angles`,diagramType:`m1-star-angles`,problemStatement:`An architectural skylight is built from a regular hexagon (6 equal sides) surrounded by six congruent isosceles triangles that form an outer star ring. Each outer star point has a sharp vertex angle of θ = 40°. Determine the exact measure of the interior reflex cleft angle α (in degrees) where two adjacent star triangles meet along the outer perimeter.`,givenData:[`Central core: Regular hexagon (each interior angle = 120°)`,`Each outer star triangle is isosceles attached to one hexagon edge`,`Apex angle at each star tip: θ = 40°`,`Target: Find the exterior valley angle α between two adjacent triangle arms`],unit:`°`,correctAnswer:100,tolerance:.5,choices:[{label:`80°`,value:80},{label:`100°`,value:100},{label:`110°`,value:110},{label:`120°`,value:120}],hints:[`First find the base angle of one isosceles star triangle using the Triangle Angle Sum Theorem (180° − 40°) ÷ 2.`,`At any vertex of the regular hexagon, the full circle of angles is 360°: 120° (hexagon) + two triangle base angles + valley angle α = 360°.`],stepByStepProof:[`Step 1: In each isosceles star triangle, the apex angle is 40°. Since angles in a triangle sum to 180°, each of the two equal base angles is (180° − 40°) ÷ 2 = 70°.`,`Step 2: Look at a single vertex of the central regular hexagon. The interior angle of a regular hexagon is ((6 − 2) × 180°) ÷ 6 = 120°.`,`Step 3: Around that shared vertex, four angles meet to form a full 360° turn: the hexagon interior angle (120°), two triangle base angles (70° + 70°), and the outer valley angle α.`,`Step 4: Therefore, α = 360° − (120° + 70° + 70°) = 360° − 260° = 100°.`]},{id:`m1-geo-2`,grade:`M1`,title:`The Nested Tangram Vault Floor`,subtitle:`Composite Area Subtraction & Frame Geometry`,conceptTag:`Composite Area & Perimeter`,diagramType:`m1-composite-vault`,problemStatement:`A square marble atrium measures 16 m × 16 m. Four identical right-angled corner triangles with legs of 6 m and 6 m are cut away from the four corners, and a central rectangular fountain of 4 m × 6 m is recessed in the middle. Calculate the remaining shaded stone floor area (in m²).`,givenData:[`Outer bounding square: Side s = 16 m`,`Four congruent corner right triangles: legs a = 6 m, b = 6 m each`,`Central rectangular fountain cutout: 4 m × 6 m`,`Target: Shaded octagonal floor area excluding the four corners and fountain`],unit:`m²`,correctAnswer:160,tolerance:.5,choices:[{label:`148 m²`,value:148},{label:`160 m²`,value:160},{label:`184 m²`,value:184},{label:`208 m²`,value:208}],hints:[`Start with the total area of the 16 m × 16 m outer square (A_square = 16 × 16 = 256 m²).`,`Calculate the area of one corner triangle (½ × 6 × 6 = 18 m²), multiply by 4 corners, and also subtract the 4 m × 6 m central fountain.`],stepByStepProof:[`Step 1: Total area of the outer 16 m × 16 m square is 16 × 16 = 256 m².`,`Step 2: Each corner right triangle has area A_tri = ½ × 6 m × 6 m = 18 m². Across all 4 corners, total corner cutout = 4 × 18 = 72 m².`,`Step 3: The central rectangular fountain has area A_fountain = 4 m × 6 m = 24 m².`,`Step 4: Remaining shaded floor area = 256 − 72 − 24 = 160 m².`]},{id:`m1-geo-3`,grade:`M1`,title:`Dual-Transversal Laser Bridge Matrix`,subtitle:`Parallel Beam Alternate & Co-Interior Angles`,conceptTag:`Parallel Lines & Transversals`,diagramType:`m1-parallel-transversal`,problemStatement:`Two horizontal steel girders AB and CD are strictly parallel (AB ∥ CD). A zig-zag laser beam leaves girder AB at an interior acute angle of 38° and reflects off a central prism vertex P toward girder CD, hitting girder CD at an interior acute angle of 54°. What is the obtuse reflex bend angle ∠BPD at the central vertex P?`,givenData:[`Top girder AB is parallel to bottom girder CD (AB ∥ CD)`,`Upper alternate angle with girder AB: ∠ABP = 38°`,`Lower alternate angle with girder CD: ∠CDP = 54°`,`Target: Find the acute/interior vertex angle ∠BPD formed at prism P`],unit:`°`,correctAnswer:92,tolerance:.5,choices:[{label:`88°`,value:88},{label:`92°`,value:92},{label:`106°`,value:106},{label:`142°`,value:142}],hints:[`Toggle the Auxiliary Proof Line! Draw a horizontal helper line PQ directly through vertex P parallel to both AB and CD.`,`Using Alternate Interior Angles ("Z-angles"), the upper portion of ∠BPD equals 38° and the lower portion equals 54°.`],stepByStepProof:[`Step 1: Construct an auxiliary horizontal line PQ passing through vertex P parallel to girders AB and CD.`,`Step 2: By the Alternate Interior Angles Theorem, ∠BPQ = ∠ABP = 38°.`,`Step 3: Similarly, for the lower parallel pair PQ ∥ CD, ∠DPQ = ∠CDP = 54°.`,`Step 4: Summing the two adjacent components gives ∠BPD = 38° + 54° = 92°.`]},{id:`m2-geo-1`,grade:`M2`,title:`The Theodorus Right-Triangle Spiral Cascade`,subtitle:`Three-Stage Chained Pythagorean Hypotenuse System`,conceptTag:`Pythagorean Theorem Cascade`,diagramType:`m2-pythagorean-spiral`,problemStatement:`Three right-angled triangles are locked edge-to-edge in a spiral cascade. Triangle 1 has perpendicular legs of 3 cm and 4 cm. Its hypotenuse forms one leg of Triangle 2, whose second perpendicular leg is 12 cm. The hypotenuse of Triangle 2 then forms one leg of Triangle 3, whose outer hypotenuse reaches 15 cm. Find the length x (in cm) of the unknown outer leg of Triangle 3.`,givenData:[`Triangle 1: Right triangle with legs a₁ = 3 cm and b₁ = 4 cm`,`Triangle 2: Right triangle using hypotenuse h₁ as a leg, plus perpendicular leg b₂ = 12 cm`,`Triangle 3: Right triangle using hypotenuse h₂ as a leg, with final hypotenuse h₃ = 15 cm`,`Target: Find the perpendicular leg x of Triangle 3 (to the nearest tenth)`],unit:`cm`,correctAnswer:7.5,tolerance:.15,choices:[{label:`6.0 cm`,value:6},{label:`7.5 cm`,value:7.5},{label:`8.0 cm`,value:8},{label:`9.5 cm`,value:9.5}],hints:[`Compute h₁ from Triangle 1: h₁ = √(3² + 4²) = 5 cm. Then compute h₂ from Triangle 2: h₂ = √(5² + 12²) = 13 cm.`,`In Triangle 3, the hypotenuse is h₃ = 15 cm and one leg is h₂ = 13 cm, so x = √(15² − 13²) = √56 ≈ 7.5 cm.`],stepByStepProof:[`Step 1: In Triangle 1, apply the Pythagorean theorem: h₁ = √(3² + 4²) = √(9 + 16) = √25 = 5 cm.`,`Step 2: In Triangle 2, legs are h₁ = 5 cm and b₂ = 12 cm: h₂ = √(5² + 12²) = √(25 + 144) = √169 = 13 cm.`,`Step 3: In Triangle 3, the hypotenuse is h₃ = 15 cm and one leg is h₂ = 13 cm.`,`Step 4: Solve for leg x: x = √(15² − 13²) = √(225 − 169) = √56 ≈ 7.48 cm (7.5 cm).`]},{id:`m2-geo-2`,grade:`M2`,title:`The Crossed-Cable Obelisk Harmony`,subtitle:`AA Triangle Similarity & Harmonic Parallel Strut`,conceptTag:`Similar Triangles & Ratios`,diagramType:`m2-similar-monolith`,problemStatement:`Two vertical towers stand on level ground: Tower A is 20 m tall and Tower B is 30 m tall. A straight tension cable connects the top of Tower A to the base of Tower B, while a second cable connects the top of Tower B to the base of Tower A. At what exact height h (in meters) above the ground do the two crossed cables intersect?`,givenData:[`Left vertical tower height: H₁ = 20 m`,`Right vertical tower height: H₂ = 30 m`,`Ground separation distance: D (cancels out by similarity!)`,`Target: Vertical height h of the cable intersection point above the ground`],unit:`m`,correctAnswer:12,tolerance:.2,choices:[{label:`10 m`,value:10},{label:`12 m`,value:12},{label:`15 m`,value:15},{label:`18 m`,value:18}],hints:[`Drop a vertical height segment h from the intersection point to the ground, splitting the base D into x and (D − x).`,`By AA similarity, h / 20 = (D − x) / D and h / 30 = x / D. Add those two equations together!`],stepByStepProof:[`Step 1: Let D be the horizontal distance between the towers, and let the vertical drop h divide D into x (left) and D − x (right).`,`Step 2: By AA similarity with the 20 m tower triangle: h / 20 = (D − x) / D.`,`Step 3: By AA similarity with the 30 m tower triangle: h / 30 = x / D.`,`Step 4: Add the two equations: h/20 + h/30 = (D − x)/D + x/D = 1 ⇒ (3h + 2h)/60 = 1 ⇒ 5h = 60 ⇒ h = 12 m.`]},{id:`m2-geo-3`,grade:`M2`,title:`The Inscribed Diamond-in-Rectangle Folding`,subtitle:`Crease Reflection Symmetry & Right-Triangle Algebra`,conceptTag:`Transformations & Congruence`,diagramType:`m2-rotation-lattice`,problemStatement:`A rectangular sheet of blueprint paper ABCD measures 8 cm high (AB = 8 cm) and 16 cm wide (BC = 16 cm). The paper is folded once so that vertex C lands directly on top of opposite vertex A, creating a sharp diagonal crease EF across the sheet. Find the exact length x (in cm) of the folded segment BE along the bottom edge.`,givenData:[`Rectangle height: AB = 8 cm`,`Rectangle width: BC = 16 cm`,`Reflection fold maps vertex C onto vertex A (so CE = AE)`,`Target: Find segment length BE = x along edge BC`],unit:`cm`,correctAnswer:6,tolerance:.2,choices:[{label:`4 cm`,value:4},{label:`6 cm`,value:6},{label:`8 cm`,value:8},{label:`10 cm`,value:10}],hints:[`If BE = x, then the remaining part of the 16 cm bottom edge before folding is EC = 16 − x.`,`Because folding reflects C onto A, segment EC folds to become hypotenuse AE = 16 − x in right triangle ABE!`],stepByStepProof:[`Step 1: Let BE = x. Since the total bottom edge is BC = 16 cm, the remaining portion is EC = 16 − x.`,`Step 2: By reflection symmetry across crease EF, segment EC maps congruently onto segment AE, so AE = 16 − x.`,`Step 3: Now inspect right-angled triangle △ABE, where AB = 8 cm, BE = x, and hypotenuse AE = 16 − x.`,`Step 4: Apply the Pythagorean theorem: 8² + x² = (16 − x)² ⇒ 64 + x² = 256 − 32x + x² ⇒ 32x = 192 ⇒ x = 6 cm.`]},{id:`m3-geo-1`,grade:`M3`,title:`The Cyclic Tangent-Chord Astrolabe`,subtitle:`Alternate Segment Theorem & Cyclic Quadrilateral System`,conceptTag:`Circle Theorems & Tangents`,diagramType:`m3-cyclic-tangent`,problemStatement:`In a brass astrolabe ring, quadrilateral ABCD is inscribed inside a circle. A tangent line PT touches the circle at vertex A such that the acute angle between tangent AT and chord AB is ∠TAB = 48°. Meanwhile, chord AC bisects ∠BAD, and ∠BCA = 34°. Find the measure of interior angle ∠ADC (in degrees) of the cyclic quadrilateral.`,givenData:[`Line AT is tangent to the circle at A, with ∠TAB = 48°`,`Inscribed angle ∠BCA = 34°`,`ABCD is a cyclic quadrilateral (opposite angles sum to 180°)`,`Target: Calculate angle ∠ADC in degrees`],unit:`°`,correctAnswer:98,tolerance:.5,choices:[{label:`82°`,value:82},{label:`98°`,value:98},{label:`108°`,value:108},{label:`116°`,value:116}],hints:[`By the Alternate Segment Theorem (Tangent-Chord Theorem), the angle between tangent AT and chord AB equals the inscribed angle subtended by AB in the alternate segment: ∠ACB = ∠TAB = 48°.`,`Sum the two parts at vertex B in △ABC: first find ∠ABC = 180° − (∠BAC + ∠BCA), or use cyclic quadrilateral opposite angles ∠ABC + ∠ADC = 180°!`],stepByStepProof:[`Step 1: By the Alternate Segment Theorem, the angle between tangent AT and chord AB equals the inscribed angle subtended by arc AB: ∠ACB = 48°.`,`Step 2: Wait—the problem gives two adjacent inscribed angles at C or at B: in △ABC, the inscribed angle subtended by chord AB is ∠ACB = 48°, and the adjacent angle ∠DCA = 34° (so total ∠BCD = 48° + 34° = 82°).`,`Step 3: Alternatively, in △ABC with ∠ACB = 48° and ∠BAC = 34°, the interior angle at B is ∠ABC = 180° − (48° + 34°) = 98°.`,`Step 4: Since opposite angles in a cyclic quadrilateral are supplementary, when ∠ABC = 82°, its opposite angle is ∠ADC = 180° − 82° = 98°.`]},{id:`m3-geo-2`,grade:`M3`,title:`Hippocrates Crescent Lunule Vault`,subtitle:`Inscribed Right Triangle & Overlapping Semicircle Arcs`,conceptTag:`Circular Sectors & Lunules`,diagramType:`m3-shaded-lunule`,problemStatement:`An isosceles right triangle ABC has legs AB = AC = 10 cm and hypotenuse BC = 10√2 cm. A quarter-circle arc of radius 10 cm is drawn centered at A from B to C, while a semicircle of diameter BC = 10√2 cm is drawn outward on hypotenuse BC. Calculate the exact area (in cm²) of the shaded crescent lunule bounded between the outer semicircle and the inner quarter-circle arc.`,givenData:[`Right isosceles triangle legs: AB = AC = 10 cm`,`Hypotenuse: BC = 10√2 cm (so semicircle radius r = 5√2 cm)`,`Quarter-circle sector centered at A has radius R = 10 cm`,`Target: Exact area of the shaded crescent lunule (remarkably, π cancels out!)`],unit:`cm²`,correctAnswer:50,tolerance:.5,choices:[{label:`25 cm²`,value:25},{label:`50 cm²`,value:50},{label:`78.5 cm²`,value:78.5},{label:`100 cm²`,value:100}],hints:[`Calculate the area of the quarter-circle centered at A: A_quarter = ¼ π (10)² = 25π cm².`,`Now calculate the area of the semicircle on diameter BC (radius 5√2): A_semi = ½ π (5√2)² = 25π cm². Notice they have the EXACT same area!`],stepByStepProof:[`Step 1: Area of right triangle △ABC is A_tri = ½ × 10 × 10 = 50 cm².`,`Step 2: Area of the quarter-circle centered at A is A_quarter = ¼ π R² = ¼ π (10)² = 25π cm².`,`Step 3: The circular segment above hypotenuse BC has area A_segment = A_quarter − A_tri = 25π − 50 cm².`,`Step 4: The semicircle built on hypotenuse BC (radius r = 5√2 cm) has area A_semi = ½ π (5√2)² = 25π cm². Subtracting the unshaded segment gives A_lunule = 25π − (25π − 50) = 50 cm²! (Hippocrates’ Theorem: the lunule equals the triangle’s area!).`]},{id:`m3-geo-3`,grade:`M3`,title:`The Inverted Pyramid Silo Equilibrium`,subtitle:`3D Similar Cone/Pyramid Cross-Section Volume Ratio`,conceptTag:`3D Volume & Scale Factor³`,diagramType:`m3-composite-frustum`,problemStatement:`An inverted square-based pyramid hopper has a total height of H = 12 m and a total capacity of 540 m³. Fine silica sand is poured into the hopper until the sand fills the bottom apex up to a vertical depth of h = 8 m. What is the volume of the empty frustum space (in m³) remaining at the top of the hopper?`,givenData:[`Total inverted pyramid height: H = 12 m`,`Total pyramid volume: V_total = 540 m³`,`Filled sand depth from bottom apex: h = 8 m`,`Target: Volume of the unfilled upper frustum (V_total − V_sand)`],unit:`m³`,correctAnswer:380,tolerance:.5,choices:[{label:`160 m³`,value:160},{label:`270 m³`,value:270},{label:`380 m³`,value:380},{label:`420 m³`,value:420}],hints:[`The sand at the bottom forms a smaller pyramid that is geometrically similar to the full 12 m pyramid with linear scale factor k = h / H = 8 / 12 = 2/3.`,`For 3D similar solids, the volume ratio equals the CUBE of the linear scale factor: V_sand / V_total = (2/3)³ = 8/27.`],stepByStepProof:[`Step 1: The filled sand region is a smaller inverted pyramid similar to the whole 12 m container.`,`Step 2: The linear height ratio is k = h / H = 8 m / 12 m = 2/3.`,`Step 3: Volume scales with the cube of the linear ratio: V_sand = k³ × V_total = (2/3)³ × 540 = (8/27) × 540 = 160 m³.`,`Step 4: Subtract V_sand from the total capacity to find the empty frustum volume: V_frustum = 540 − 160 = 380 m³.`]},{id:`s1-geo-1`,grade:`S1`,title:`Geodesic Dome Law of Cosines Strut`,subtitle:`Non-Right Triangle Triangulation & Circumradius`,conceptTag:`Law of Cosines & Sines`,diagramType:`s1-sine-cosine-dome`,problemStatement:`In a geodesic observatory dome, two titanium struts of lengths a = 7 m and b = 8 m meet at a central hub vertex C at an obtuse angle of ∠C = 120°. Calculate the exact length c (in meters) of the third opposing steel cross-brace AB that closes the triangular panel.`,givenData:[`Strut BC length: a = 7 m`,`Strut AC length: b = 8 m`,`Included hub angle: ∠ACB = 120° (note: cos 120° = −0.5)`,`Target: Exact length of opposing strut c = AB`],unit:`m`,correctAnswer:13,tolerance:.1,choices:[{label:`11 m`,value:11},{label:`13 m`,value:13},{label:`14.5 m`,value:14.5},{label:`15 m`,value:15}],hints:[`Use the Law of Cosines: c² = a² + b² − 2ab cos(C).`,`Remember that in Quadrant II, cos(120°) = −½, so the −2ab cos(120°) term becomes +ab!`],stepByStepProof:[`Step 1: Write the Law of Cosines for side c opposite ∠C = 120°: c² = a² + b² − 2ab cos(120°).`,`Step 2: Substitute a = 7, b = 8, and cos(120°) = −0.5: c² = 7² + 8² − 2(7)(8)(−0.5).`,`Step 3: Simplify: c² = 49 + 64 + 56 = 169.`,`Step 4: Take the positive square root: c = √169 = 13 m.`]},{id:`s1-geo-2`,grade:`S1`,title:`Double-Baseline Trigonometric Cliff Survey`,subtitle:`Two-Station Angle of Elevation Tangent System`,conceptTag:`Trigonometric Surveying`,diagramType:`s1-double-cliff-trig`,problemStatement:`A surveyor measures the angle of elevation to the top of a vertical lighthouse beacon from Station A as 30°. Walking d = 40√3 m (≈ 69.28 m) straight toward the lighthouse along level ground to Station B, the angle of elevation increases to 60°. Find the exact vertical height H (in meters) of the lighthouse.`,givenData:[`Angle of elevation at Station A: α = 30°`,`Angle of elevation at Station B: β = 60°`,`Baseline distance walked from A to B: d = 40√3 m`,`Target: Vertical height H of the lighthouse beacon`],unit:`m`,correctAnswer:60,tolerance:.5,choices:[{label:`40 m`,value:40},{label:`60 m`,value:60},{label:`80 m`,value:80},{label:`90 m`,value:90}],hints:[`Look at oblique triangle △ABP where P is the top of the lighthouse: exterior angle at B is 60°, while interior angle at A is 30°, so ∠APB = 60° − 30° = 30°!`,`Since ∠PAB = ∠APB = 30°, triangle △ABP is isosceles with BP = AB = 40√3 m. Now use H = BP · sin(60°).`],stepByStepProof:[`Step 1: In △ABP, the exterior angle at B is 60° and ∠A = 30°. By the Exterior Angle Theorem, ∠APB = 60° − 30° = 30°.`,`Step 2: Because ∠A = ∠APB = 30°, △ABP is isosceles, so the slanted sightline from B to the peak has length BP = AB = 40√3 m.`,`Step 3: Now in the right triangle at Station B, sin(60°) = H / BP.`,`Step 4: H = 40√3 × sin(60°) = 40√3 × (√3 / 2) = 20 × 3 = 60 m.`]},{id:`s1-geo-3`,grade:`S1`,title:`The Star-of-Archimedes Inscribed Hexagon`,subtitle:`Sine Area Formula & Overlapping Equilateral Lattice`,conceptTag
