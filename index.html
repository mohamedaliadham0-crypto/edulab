t in a laboratory.`},{id:`m1-eng-3`,category:`Grammar`,prompt:`There isn’t ________ distilled water left in the glass bottle, so we need to refill it.`,options:[`many`,`a few`,`much`,`several`],correctIndex:2,explanation:`"Water" is an uncountable noun. In negative sentences with uncountable nouns, we use "much" rather than "many" or "a few".`},{id:`m1-eng-4`,category:`Context Clues`,prompt:`Ice floats on liquid water because solid ice is less ________ than the water beneath it.`,options:[`transparent`,`dense`,`fragile`,`noisy`],correctIndex:1,explanation:`Whether an object floats or sinks in a fluid depends on how "dense" (mass per unit volume) it is compared to the liquid.`},{id:`m1-eng-5`,category:`Sentence Structure`,prompt:`Choose the sentence that is written with correct word order and punctuation:`,options:[`Always carefully measure the temperature before you record the result.`,`Measure always the temperature carefully before you the result record.`,`Before you record the result, carefully measure always the temperature.`,`The temperature measure carefully always before record you the result.`],correctIndex:0,explanation:`In imperative instructions, adverbs of frequency/manner ("Always carefully") precede the base verb ("measure"), followed by the direct object and time clause.`},{id:`m1-eng-6`,category:`Grammar`,prompt:`While Tariq ________ the thermometer, Salma wrote down the numbers in her notebook.`,options:[`reads`,`was reading`,`has read`,`will read`],correctIndex:1,explanation:`Use the past continuous ("was reading") for a longer background action in progress when another past action ("wrote") occurred.`},{id:`m1-eng-7`,category:`Reading Comprehension`,passage:` Desert foxes, also known as fennec foxes, have remarkably large ears that can grow up to 15 centimeters long. First, these sensitive ears help the fox hear beetles and small rodents moving quietly underground at night. Second, dozens of tiny blood vessels inside the ears release excess body heat into the cool night air, keeping the animal comfortable in the Sahara Desert.`,prompt:`According to the passage, what are the TWO main functions of the fennec fox’s large ears?`,options:[`Locating underground prey by sound and cooling the fox’s body`,`Protecting its eyes from sandstorms and storing extra water`,`Helping the fox dig deep burrows and scare away larger predators`,`Signaling other foxes during the day and absorbing sunlight`],correctIndex:0,explanation:`The passage explicitly states two functions: hearing prey moving underground at night ("First...") and releasing excess body heat ("Second...").`},{id:`m1-eng-8`,category:`Inference`,passage:`Desert foxes, also known as fennec foxes, have remarkably large ears that can grow up to 15 centimeters long. First, these sensitive ears help the fox hear beetles and small rodents moving quietly underground at night. Second, dozens of tiny blood vessels inside the ears release excess body heat into the cool night air.`,prompt:`Based on the passage, when is the fennec fox most likely active in hunting for food?`,options:[`During the night when the desert air is cool`,`At noon when the desert sun is brightest`,`Only during heavy winter rainstorms`,`Early in the morning before birds wake up`],correctIndex:0,explanation:`We can infer the fox hunts at night because its ears are adapted to hear prey moving "underground at night" and release heat into "the cool night air".`},{id:`m1-eng-9`,category:`Vocabulary`,prompt:`A material that allows light to pass through it clearly so objects behind it can be seen is called ________.`,options:[`opaque`,`transparent`,`magnetic`,`flexible`],correctIndex:1,explanation:`"Transparent" describes materials (like clear glass or clean water) that transmit light without scattering it.`},{id:`m1-eng-10`,category:`Sentence Structure`,prompt:`Combine these two ideas logically: "The metal strip was very hot." + "We used steel tongs to lift it."`,options:[`The metal strip was very hot, so we used steel tongs to lift it.`,`The metal strip was very hot,although we used steel tongs to lift it.`,`Because we used steel tongs to lift it, the metal strip was very hot.`,`The metal strip was very hot unless we used steel tongs to lift it.`],correctIndex:0,explanation:`The coordinating conjunction "so" accurately introduces the logical result/consequence of the metal strip being hot.`}]},M2:{grade:`M2`,title:`Middle 2 Analytical English Proficiency Exam`,targetCefrRange:`A2 – B2 Analytical Track`,timeEstimate:`15 Minutes · 10 Questions`,overview:`Assesses present perfect vs. past simple, first/second conditionals, relative clauses, academic context clues, and multi-paragraph reading inference.`,questions:[{id:`m2-eng-1`,category:`Grammar`,prompt:`Scientists ________ over one hundred elements on the Periodic Table since Dmitri Mendeleev published his first chart in 1869.`,options:[`discovered`,`have discovered`,`are discovering`,`had discover`],correctIndex:1,explanation:`Use the present perfect ("have discovered") with "since + [past point in time]" to describe cumulative actions continuing from 1869 up to the present.`},{id:`m2-eng-2`,category:`Grammar`,prompt:`If you ________ a strip of magnesium ribbon into dilute hydrochloric acid, it immediately produces hydrogen gas bubbles.`,options:[`will drop`,`dropped`,`drop`,`would drop`],correctIndex:2,explanation:`In a Zero Conditional describing a scientific law or guaranteed physical result, both clauses take the present simple ("If you drop..., it produces...").`},{id:`m2-eng-3`,category:`Vocabulary`,prompt:`Because helium does not react easily with other elements, chemists describe it as chemically ________.`,options:[`volatile`,`inert`,`corrosive`,`abundant`],correctIndex:1,explanation:`"Inert" means chemically inactive or unreactive, which is the defining property of Group 18 noble gases.`},{id:`m2-eng-4`,category:`Sentence Structure`,prompt:`Select the sentence that uses a defining relative clause correctly:`,options:[`Mercury is the only metallic element that remains liquid at room temperature.`,`Mercury is the only metallic element whom remains liquid at room temperature.`,`Mercury is the only metallic element where it remains liquid at room temperature.`,`Mercury, who is a metallic element, remains liquid at room temperature.`],correctIndex:0,explanation:`For non-human things ("the only metallic element"), "that" or "which" serves as the subject relative pronoun without a redundant pronoun ("it").`},{id:`m2-eng-5`,category:`Context Clues`,prompt:`Although the desert canyon appeared completely **barren** from a distance, a closer inspection revealed resilient lichens and tiny desert wildflowers.`,options:[`Empty of plant life and unable to support much growth`,`Flooded with deep freshwater lakes`,`Crowded with tall pine forests`,`Covered in modern concrete buildings`],correctIndex:0,explanation:`The contrast word "Although" signals that "barren" is the opposite of having "resilient lichens and tiny desert wildflowers"—meaning lifeless or unproductive.`},{id:`m2-eng-6`,category:`Grammar`,prompt:`The laboratory glassware must ________ thoroughly with deionized water before the next class arrives.`,options:[`rinse`,`be rinsed`,`rinsing`,`have rinse`],correctIndex:1,explanation:`Because "laboratory glassware" receives the action, a modal passive construction ("must + be + past participle") is required: "must be rinsed".`},{id:`m2-eng-7`,category:`Reading Comprehension`,passage:`In 1799, Italian physicist Alessandro Volta constructed the "voltaic pile," the world’s first electrical battery capable of providing a steady electric current to a circuit. Before Volta’s invention, researchers could only study static electricity produced by friction jars, which discharged in a single brief spark. By alternating discs of zinc and copper separated by brine-soaked cardboard, Volta enabled scientists to pass continuous currents through water and discover new elements like sodium and potassium.`,prompt:`What major limitation did researchers face BEFORE Alessandro Volta invented the voltaic pile?`,options:[`Electrical charge could only be released as a momentary spark rather than a continuous current`,`Zinc and copper were too expensive to mine in Europe`,`Water could not be stored in glass containers`,`Static electricity was completely unknown to physicists`],correctIndex:0,explanation:`The text explains that prior to Volta’s battery, researchers relied on friction jars that "discharged in a single brief spark" instead of a steady current.`},{id:`m2-eng-8`,category:`Inference`,passage:`In 1799, Italian physicist Alessandro Volta constructed the "voltaic pile," the world’s first electrical battery capable of providing a steady electric current to a circuit... By alternating discs of zinc and copper separated by brine-soaked cardboard, Volta enabled scientists to pass continuous currents through water and discover new elements like sodium and potassium.`,prompt:`What can be inferred about the relationship between physics and chemistry from this passage?`,options:[`Advances in physical instrumentation directly unlocked new discoveries in chemistry`,`Chemists refused to use inventions created by physicists`,`Sodium and potassium were used to build the first voltaic pile`,`Cardboard is a better conductor of electricity than copper`],correctIndex:0,explanation:`A physics invention (Volta’s steady-current battery) directly gave chemists the tool needed to electrolyze compounds and isolate new chemical elements.`},{id:`m2-eng-9`,category:`Vocabulary`,prompt:`When two forces acting on a stationary cart are equal in magnitude and opposite in direction, they are in ________.`,options:[`acceleration`,`equilibrium`,`refraction`,`combustion`],correctIndex:1,explanation:`"Equilibrium" denotes a state of balance in which opposing forces or influences cancel each other out (net force = 0).`},{id:`m2-eng-10`,category:`Sentence Structure`,prompt:`Which transition word best completes the sentence? "Copper is an excellent conductor of electricity; ________, rubber is an insulator used to coat electrical wires safely."`,options:[`furthermore`,`conversely`,`consequently`,`for instance`],correctIndex:1,explanation:`"Conversely" introduces a direct contrast between two opposite properties (copper conducting vs. rubber insulating).`}]},M3:{grade:`M3`,title:`Middle 3 Upper-Intermediate English Proficiency Exam`,targetCefrRange:`B1 – C1 Academic Track`,timeEstimate:`15–18 Minutes · 10 Questions`,overview:`Tests past perfect, unreal conditionals, reported speech, precise academic vocabulary, syntactic parallelism, and rhetorical reading comprehension.`,questions:[{id:`m3-eng-1`,category:`Grammar`,prompt:`By the time the safety inspector entered the chemistry room, the students ________ already ________ the Bunsen burners.`,options:[`have / extinguished`,`had / extinguished`,`were / extinguishing`,`would / extinguish`],correctIndex:1,explanation:`The past perfect ("had already extinguished") indicates an action completed prior to another past reference point ("entered").`},{id:`m3-eng-2`,category:`Grammar`,prompt:`If the optical lens ________ a shorter focal length, it would bend the parallel light rays more sharply.`,options:[`has`,`had`,`will have`,`would have had`],correctIndex:1,explanation:`In a Second Conditional (present/general hypothetical), the "if" clause takes the past simple/subjunctive ("had") paired with "would + base verb" in the main clause.`},{id:`m3-eng-3`,category:`Vocabulary`,prompt:`The astronomer noted that the faint signal was not a random glitch; rather, it recurred at ________ intervals of exactly 1.337 seconds.`,options:[`erratic`,`periodic`,`ambiguous`,`negligible`],correctIndex:1,explanation:`"Periodic" means occurring or repeating at regular, predictable intervals of time.`},{id:`m3-eng-4`,category:`Sentence Structure`,prompt:`Choose the sentence that demonstrates correct parallel structure:`,options:[`A rigorous scientist must calibrate the instruments, record the raw measurements, and analyze the margin of error.`,`A rigorous scientist must calibrate the instruments, recording the raw measurements, and analysis of the margin of error.`,`A rigorous scientist must be calibrating instruments, to record measurements, and analyze the margin of error.`,`Calibrating the instruments, to record raw measurements, and analyzing margins of error are what a scientist must do.`],correctIndex:0,explanation:`Parallelism requires matching grammatical forms in a coordinate series after the modal "must": base verbs "calibrate..., record..., and analyze...".`},{id:`m3-eng-5`,category:`Context Clues`,prompt:`Initial estimates of the glacier’s retreat were **conservative**; recent satellite radar measurements reveal the ice is melting nearly twice as fast as previously modeled.`,options:[`Cautiously low and underestimating the true scale`,`Wildly exaggerated to cause public alarm`,`Completely unrelated to climate measurements`,`Calculated without using any mathematics`],correctIndex:0,explanation:`In scientific and statistical contexts, a "conservative estimate" is a cautious, intentionally low figure—confirmed here by the fact that actual melting is twice as fast.`},{id:`m3-eng-6`,category:`Grammar`,prompt:`The lead researcher asked the laboratory technician whether the water samples ________ tested for heavy metals yet.`,options:[`have been`,`had been`,`are being`,`will be`],correctIndex:1,explanation:`In reported speech introduced by a past reporting verb ("asked"), present perfect passive ("have been tested") backshifts to past perfect passive ("had been tested").`},{id:`m3-eng-7`,category:`Reading Comprehension`,passage:`For centuries, glassmakers prized ruby-red stained glass without realizing that their craft relied on nanotechnology. By mixing trace amounts of gold chloride into molten silica, artisans created microscopic gold nanoparticles suspended throughout the cooled glass. Unlike bulk gold, which reflects yellow light, spheres of gold measuring just 20 nanometers across absorb green and blue wavelengths through surface plasmon resonance, transmitting only a deep, luminous crimson glow.`,prompt:`Why does gold-infused stained glass appear crimson red instead of metallic yellow?`,options:[`Nanoscale gold particles interact with light differently than bulk gold, absorbing green-blue wavelengths and transmitting red`,`The molten silica burns the gold into red iron oxide rust during heating`,`Artisans painted the outside of the glass with red anthocyanin dye after cooling`,`Chlorine gas trapped in the glass glows red when heated by sunlight`],correctIndex:0,explanation:`The passage explains that 20-nanometer gold spheres exhibit surface plasmon resonance, absorbing green/blue light and transmitting deep crimson wavelengths.`},{id:`m3-eng-8`,category:`Inference`,passage:`For centuries, glassmakers prized ruby-red stained glass without realizing that their craft relied on nanotechnology. By mixing trace amounts of gold chloride into molten silica, artisans created microscopic gold nanoparticles suspended throughout the cooled glass. Unlike bulk gold, which reflects yellow light, spheres of gold measuring just 20 nanometers across absorb green and blue wavelengths...`,prompt:`Which broader scientific principle is best illustrated by the example of ruby-red glass in the passage?`,options:[`The physical and optical properties of an element can change dramatically depending on the size scale of its particles`,`Ancient artisans possessed electron microscopes to measure 20-nanometer spheres`,`Gold is the only metal on the Periodic Table capable of absorbing light`,`Chemical compounds always retain the exact color of their constituent elements`],correctIndex:0,explanation:`Comparing yellow bulk gold with crimson 20 nm gold nanoparticles demonstrates that material properties depend not only on chemical composition but also on nanoscale dimension.`},{id:`m3-eng-9`,category:`Vocabulary`,prompt:`Despite three independent trials, the team could not ________ the controversial findings reported in last month’s journal.`,options:[`replicate`,`evaporate`,`subjugate`,`oscillate`],correctIndex:0,explanation:`To "replicate" an experiment or finding means to reproduce the same results independently to verify scientific validity.`},{id:`m3-eng-10`,category:`Sentence Structure`,prompt:`Select the most concise and grammatically sound revision: "Due to the fact that the solution was turbid in appearance, light rays could not pass through it unimpeded."`,options:[`Because the solution was turbid, light rays could not pass through it unimpeded.`,`Being that the solution had turbidity in its appearance, light rays were not passing unimpeded.`,`Due to the turbidity of the solution’s appearance, unimpeded light rays could not be passed.`,`The solution was turbid in appearance, that is why light rays could not pass through it.`],correctIndex:0,explanation:`Replacing the wordy phrase "Due to the fact that" with "Because" and eliminating the redundant "in appearance" after "turbid" (which already means cloudy) yields crisp academic prose.`}]},S1:{grade:`S1`,title:`Senior 1 Advanced Academic English Exam`,targetCefrRange:`B2 – C1+ Senior Track`,timeEstimate:`18 Minutes · 10 Questions`,overview:`Evaluates third and mixed conditionals, participle clauses, academic collocations, nuanced vocabulary in context, and synthesis of scientific arguments.`,questions:[{id:`s1-eng-1`,category:`Grammar`,prompt:`Had the engineers accounted for thermal expansion in the steel bridge joints, the pavement ________ during the July heatwave.`,options:[`would not buckle`,`would not have buckled`,`will not buckle`,`had not buckled`],correctIndex:1,explanation:`"Had the engineers accounted..." is an inverted Third Conditional ("If the engineers had accounted..."), requiring "would not have + past participle" for a past counterfactual outcome.`},{id:`s1-eng-2`,category:`Sentence Structure`,prompt:`Choose the sentence that avoids a dangling participle modifier:`,options:[`Peering through the high-powered optical microscope, the biochemist observed rapid mitosis in the stained cells.`,`Peering through the high-powered optical microscope, rapid mitosis was observed in the stained cells.`,`Peering through the high-powered optical microscope, the stained cells revealed rapid mitosis.`,`While peering through the high-powered optical microscope, the glass slide showed rapid mitosis.`],correctIndex:0,explanation:`The introductory participial phrase ("Peering through...") must immediately precede the grammatical subject actually performing that action ("the biochemist").`},{id:`s1-eng-3`,category:`Vocabulary`,prompt:`The catalyst’s role in the industrial reactor is not to alter the thermodynamic equilibrium, but rather to ________ the rate at which equilibrium is attained.`,options:[`impede`,`expedite`,`preclude`,`delineate`],correctIndex:1,explanation:`To "expedite" means to accelerate or speed up a process, accurately describing how a catalyst lowers activation energy to reach equilibrium faster.`},{id:`s1-eng-4`,category:`Context Clues`,prompt:`While early seismographs were susceptible to **spurious** vibrations caused by passing freight trains, modern borehole sensors isolate genuine tectonic tremors from surface noise.`,options:[`False or misleadingly similar to genuine signals, originating from an unintended source`,`Extremely deep and originating from Earth’s inner core`,`Beneficial for calibrating musical instruments`,`Permanent and impossible to filter mathematically`],correctIndex:0,explanation:`Contrasted with "genuine tectonic tremors", "spurious" vibrations are false, non-authentic signals caused by surface interference.`},{id:`s1-eng-5`,category:`Grammar`,prompt:`Neither the primary spectrometer nor the two backup sensors ________ calibrated properly prior to yesterday’s trial.`,options:[`was`,`were`,`has been`,`is`],correctIndex:1,explanation:`With correlative conjunctions "Neither... nor...", the verb agrees in number with the closer subject ("the two backup sensors" → plural "were").`},{id:`s1-eng-6`,category:`Vocabulary`,prompt:`A scientific hypothesis must be ________; that is, there must exist a conceivable experimental observation capable of proving it wrong.`,options:[`infallible`,`falsifiable`,`ubiquitous`,`ostensible`],correctIndex:1,explanation:`Coined in the philosophy of science by Karl Popper, "falsifiable" means capable of being tested and potentially refuted by empirical evidence.`},{id:`s1-eng-7`,category:`Reading Comprehension`,passage:`When marine biologists first mapped hydrothermal vents along the Galapagos Rift in 1977, the discovery overturned a foundational assumption of ecology: that all complex ecosystems ultimately depend on solar energy captured via photosynthesis. Two thousand meters below the ocean surface—where sunlight is wholly absent—dense communities of giant tube worms, blind shrimp, and clams thrive. At the base of this food web lie chemoautotrophic bacteria that oxidize hydrogen sulfide erupting from volcanic fissures, synthesizing organic carbon in complete darkness.`,prompt:`What foundational ecological assumption was overturned by the 1977 Galapagos Rift discovery?`,options:[`That sunlight and photosynthesis are indispensable prerequisites for supporting complex biological food webs`,`That bacteria cannot survive in water temperatures above freezing`,`That volcanic fissures only exist on dry continental land`,`That tube worms and clams are capable of performing photosynthesis in dim light`],correctIndex:0,explanation:`The first sentence states that the discovery overturned the assumption "that all complex ecosystems ultimately depend on solar energy captured via photosynthesis."`},{id:`s1-eng-8`,category:`Inference`,passage:`When marine biologists first mapped hydrothermal vents along the Galapagos Rift in 1977, the discovery overturned a foundational assumption of ecology... At the base of this food web lie chemoautotrophic bacteria that oxidize hydrogen sulfide erupting from volcanic fissures, synthesizing organic carbon in complete darkness.`,prompt:`Why is the discovery of deep-sea chemoautotrophic ecosystems particularly significant for astrobiologists searching for life on icy moons such as Europa or Enceladus?`,options:[`It demonstrates that subsurface oceans heated by geological activity could sustain life even beneath thick ice shells where sunlight cannot penetrate`,`It proves that giant tube worms originally evolved in outer space`,`It shows that photosynthesis occurs more rapidly in frozen methane than in liquid water`,`It confirms that oxygen gas is toxic to all organisms living on Earth`],correctIndex:0,explanation:`Because hydrothermal vent ecosystems thrive on chemical energy from geological heat in total darkness, subterranean oceans on icy moons could similarly harbor chemosynthetic life without sunlight.`},{id:`s1-eng-9`,category:`Sentence Structure`,prompt:`Identify the sentence that correctly uses a semicolon and conjunctive adverb:`,options:[`The projectile’s horizontal velocity remains constant in a vacuum; however, its vertical velocity changes continuously due to gravity.`,`The projectile’s horizontal velocity remains constant in a vacuum, however; its vertical velocity changes continuously due to gravity.`,`The projectile’s horizontal velocity; however, remains constant in a vacuum, its vertical velocity changes continuously.`,`Although the projectile’s horizontal velocity remains constant; however, its vertical velocity changes due to gravity.`],correctIndex:0,explanation:`When joining two independent clauses with a conjunctive adverb ("however"), place a semicolon before the conjunctive adverb and a comma immediately after it.`},{id:`s1-eng-10`,category:`Vocabulary`,prompt:`The two geometric proofs arrived at the exact same formula through entirely ________ methods—one relying on Euclidean similarity and the other on vector calculus.`,options:[`redundant`,`disparate`,`superficial`,`erroneous`],correctIndex:1,explanation:`"Disparate" means fundamentally distinct or different in kind, fitting the contrast between classical Euclidean geometry and vector calculus.`}]},S2:{grade:`S2`,title:`Senior 2 Mastery Academic & Analytical English Exam`,targetCefrRange:`B2 – C2 Mastery Track`,timeEstimate:`20 Minutes · 10 Questions`,overview:`Challenges advanced learners with negative adverbial inversion, mandative subjunctive, high-register lexical precision, complex syntactic subordination, and critical epistemological reading.`,questions:[{id:`s2-eng-1`,category:`Grammar`,prompt:`Seldom ________ such an abrupt drop in electrical resistivity without cooling the alloy below its critical transition temperature.`,options:[`physicists have observed`,`have physicists observed`,`observed have physicists`,`physicists observed have`],correctIndex:1,explanation:`When a restrictive or negative adverbial ("Seldom", "Rarely", "Never", "Not only") is fronted for emphasis, subject-auxiliary inversion is mandatory: "Seldom have physicists observed...".`},{id:`s2-eng-2`,category:`Grammar`,prompt:`The international metrology committee stipulated that every regional laboratory ________ its cesium frequency standard prior to the global synchronization trial.`,options:[`recalibrates`,`recalibrated`,`recalibrate`,`will recalibrate`],correctIndex:2,explanation:`Verbs of formal requirement or demand ("stipulated", "mandated", "insisted") trigger the mandative subjunctive in the "that" clause, which uses the bare infinitive form ("recalibrate") regardless of tense or singular subject.`},{id:`s2-eng-3`,category:`Vocabulary`,prompt:`Far from being mutually exclusive, wave and particle descriptions of light are ________ frameworks whose applicability depends on the experimental apparatus employed.`,options:[`antithetical`,`complementary`,`vestigial`,`perfunctory`],correctIndex:1,explanation:`"Complementary" describes two distinct concepts (as in Niels Bohr’s Principle of Complementarity) that together provide a complete description of a phenomenon.`},{id:`s2-eng-4`,category:`Context Clues`,prompt:`Because the raw spectroscopic data contained significant instrumental drift, any conclusions drawn prior to baseline correction would be **specious** at best.`,options:[`Superficially plausible at first glance, yet actually flawed and unreliable`,`Mathematically irrefutable and universally accepted`,`Deliberately encrypted to protect industrial patents`,`Too microscopic to be plotted on a logarithmic axis`],correctIndex:0,explanation:`"Specious" means having a false look of truth or genuineness—appearing convincing on the surface while being methodologically invalid.`},{id:`s2-eng-5`,category:`Sentence Structure`,prompt:`Select the sentence that maintains impeccable syntactic subordination and clarity:`,options:[`Notwithstanding the alloy’s exceptional tensile strength at ambient temperatures, prolonged exposure to cyclic thermal stress induces microscopic grain-boundary fractures.`,`Notwithstanding that the alloy has exceptional tensile strength at ambient temperatures, but prolonged exposure to cyclic thermal stress induces fractures.`,`The alloy having exceptional tensile strength notwithstanding, however prolonged exposure to cyclic thermal stress induces fractures.`,`Although notwithstanding the alloy’s exceptional tensile strength, prolonged exposure to cyclic thermal stress induces microscopic fractures.`],correctIndex:0,explanation:`Option A uses the preposition "Notwithstanding" cleanly to introduce a concessive noun phrase, followed directly by the main clause without redundant conjunctions ("Although... but").`},{id:`s2-eng-6`,category:`Vocabulary`,prompt:`In his landmark 1687 treatise *Principia*, Isaac Newton ________ terrestrial projectile motion and celestial planetary orbits under a single universal law of gravitation.`,options:[`subsumed`,`bifurcated`,`attenuated`,`extirpated`],correctIndex:0,explanation:`To "subsume" means to include, absorb, or unify specific phenomena under a broader, more comprehensive rule or category.`},{id:`s2-eng-7`,category:`Reading Comprehension`,passage:`In 1927, Werner Heisenberg formulated the Uncertainty Principle, demonstrating that the simultaneous measurement of conjugate variables—such as a subatomic particle’s exact position and its linear momentum—is subject to an irreducible quantum limit. Crucially, this limitation is not a consequence of imperfect laboratory instrumentation, as many early commentators mistakenly surmised. Rather, it arises from the intrinsic wave-packet nature of matter itself: localizing a particle within a narrow spatial interval necessitates superposing myriad short-wavelength modes, which inherently broadens the spread of momentum values.`,prompt:`According to the passage, what common misconception regarding the Uncertainty Principle did early commentators hold?`,options:[`They attributed the measurement limit to technical flaws in laboratory instruments rather than to a fundamental property of matter`,`They believed that only macroscopic objects like planets exhibited wave-packet superposition`,`They assumed that momentum and velocity were completely unrelated physical quantities`,`They argued that Heisenberg’s equations violated the conservation of electric charge`],correctIndex:0,explanation:`The text explicitly notes that the limitation "is not a consequence of imperfect laboratory instrumentation, as many early commentators mistakenly surmised," but rather an intrinsic property of matter waves.`},{id:`s2-eng-8`,category:`Inference`,passage:`In 1927, Werner Heisenberg formulated the Uncertainty Principle, demonstrating that the simultaneous measurement of conjugate variables—such as a subatomic particle’s exact position and its linear momentum—is subject to an irreducible quantum limit... localizing a particle within a narrow spatial interval necessitates superposing myriad short-wavelength modes, which inherently broadens the spread of momentum values.`,prompt:`Based on the mathematical relationship described in the passage, what happens if an experiment measures the momentum of an electron with extreme precision (a very narrow spread of momentum)?`,options:[`The spatial uncertainty of the electron’s position becomes correspondingly large`,`The electron’s position is simultaneously pinned down to an exact point in space`,`The electron loses its electric charge and transforms into a photon`,`The wavelength of the electron drops to zero`],correctIndex:0,explanation:`Since position and momentum are conjugate variables governed by an inverse wave-packet trade-off (Δx · Δp ≥ ℏ/2), narrowing the spread in momentum necessarily broadens the uncertainty in spatial position.`},{id:`s2-eng-9`,category:`Grammar`,prompt:`________ the magnetic flux through the conducting loop remain constant over time, no electromotive force will be induced regardless of how strong the magnet is.`,options:[`Were`,`Should`,`Had`,`Unless`],correctIndex:1,explanation:`"Should + subject + bare infinitive" ("Should the magnetic flux... remain constant") is a formal inverted First Conditional paired with a predictive "will" main clause.`},{id:`s2-eng-10`,category:`Vocabulary`,prompt:`The peer-review panel praised the study’s methodological rigor but cautioned against ________ its findings from controlled laboratory cultures to complex marine ecosystems.`,options:[`extrapolating`,`corroborating`,`mitigating`,`oscillating`],correctIndex:0,explanation:`To "extrapolate" means to extend or project conclusions from a known, limited dataset into a broader, untested domain.`}]}};function Fe(e,t,n){let r=Math.round(t/n*100),i=`A1`;i=e===`M1`?r>=90?`B1`:r>=65?`A2`:`A1`:e===`M2`?r>=90?`B2`:r>=70?`B1`:r>=45?`A2`:`A1`:e===`M3`?r>=90?`C1`:r>=75?`B2`:r>=50?`B1`:r>=30?`A2`:`A1`:e===`S1`?r>=90?`C1`:r>=70?`B2`:r>=50?`B1`:r>=30?`A
